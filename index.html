<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Breaker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-container {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .coin-value {
            font-size: 24px;
            font-weight: bold;
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        .top-controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
        }
        .music-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .combo-badge {
            font-size: 13px;
            font-weight: bold;
            color: #e11d48;
            height: 20px;
            transition: opacity 0.3s;
            opacity: 0;
            text-shadow: 0 0 8px rgba(225, 29, 72, 0.6);
        }
        .game-board-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 10px;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
        }
        .cell {
            background-color: #334155;
            border-radius: 4px;
            transition: background-color 0.05s ease, transform 0.05s ease;
            position: relative;
        }
        .cell.filled {
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.8), 0 0 12px currentColor;
        }
        .cell.preview {
            opacity: 0.65;
            transform: scale(0.95);
            box-shadow: inset 0 0 6px #fff;
        }
        .bottom-panel {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 10px 10px 15px 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pieces-container {
            width: 100%;
            height: 110px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .piece-holder {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .piece-grid {
            display: grid;
            gap: 2px;
        }
        .piece-block {
            border-radius: 3px;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.6);
        }
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.85;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
            will-change: transform, left, top;
        }

        .reroll-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }
        .reroll-btn:active { transform: scale(0.95); }
        .reroll-btn:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Blok Renk Kataloğu */
        .color-1 { background-color: #ef4444; color: #ef4444; }
        .color-2 { background-color: #3b82f6; color: #3b82f6; }
        .color-3 { background-color: #10b981; color: #10b981; }
        .color-4 { background-color: #f59e0b; color: #f59e0b; }
        .color-5 { background-color: #8b5cf6; color: #8b5cf6; }
        .color-6 { background-color: #ec4899; color: #ec4899; }
        .color-7 { background-color: #06b6d4; color: #06b6d4; }

        /* Oyun Bitti Modal Tasarımı */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 30px 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(56, 189, 248, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            color: #ef4444;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-score-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
        }
        .modal-score-val {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
        }
        .restart-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s;
        }
        .restart-btn:active { transform: scale(0.96); }

        /* Havai Fişek Kıvılcım Efekti */
        .spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: fireworkSpark 0.75s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fireworkSpark {
            0% {
                transform: translate(0, 0) scale(1.8);
                opacity: 1;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        @keyframes cellFlash {
            0% { background-color: #ffffff; box-shadow: 0 0 35px #ffffff, 0 0 60px #ff4500; }
            40% { background-color: #ff4500; }
            100% { background-color: #334155; box-shadow: none; }
        }

        .exploding-cell { animation: cellFlash 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <span class="score-label">Skor</span>
            <span id="score" class="score-value">0</span>
        </div>
        <div class="score-container" style="align-items: center;">
            <span class="score-label">Coin</span>
            <span id="coins" class="coin-value">🪙 0</span>
        </div>
        <div class="score-container" style="align-items: flex-end;">
            <span class="score-label">En Yüksek</span>
            <span id="best-score" class="score-value" style="color: #cbd5e1;">0</span>
        </div>
    </header>

    <div class="top-controls">
        <button id="music-btn" class="music-btn">🎵 Müzik: Açık</button>
    </div>

    <div id="combo" class="combo-badge">COMBO x2!</div>

    <div class="game-board-wrapper">
        <div id="grid"></div>
    </div>

    <div class="bottom-panel">
        <div class="pieces-container" id="pieces-container">
            <div class="piece-holder" data-index="0"></div>
            <div class="piece-holder" data-index="1"></div>
            <div class="piece-holder" data-index="2"></div>
        </div>
        
        <button id="reroll-btn" class="reroll-btn">
            🔄 Şekil Değiştir (500 🪙)
        </button>
    </div>

    <!-- Oyun Bitti Modalı -->
    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Oyun Bitti</h2>
            <div class="modal-score-box">
                <div style="font-size: 12px; color: #94a3b8; text-transform: uppercase;">Skorun</div>
                <div id="final-score" class="modal-score-val">0</div>
            </div>
            <div style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px;">
                En Yüksek Skor: <strong id="modal-best-score" style="color: #38bdf8;">0</strong>
            </div>
            <button id="restart-btn" class="restart-btn">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let coins = parseInt(localStorage.getItem('block_breaker_coins')) || 0;
        let bestScore = parseInt(localStorage.getItem('block_breaker_best')) || 0;
        let lastCoinThreshold = 0;
        let musicEnabled = true;

        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const coinsElement = document.getElementById('coins');
        const bestScoreElement = document.getElementById('best-score');
        const comboElement = document.getElementById('combo');
        const rerollBtn = document.getElementById('reroll-btn');
        const musicBtn = document.getElementById('music-btn');
        const pieceHolders = document.querySelectorAll('.piece-holder');
        
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const modalBestScoreElement = document.getElementById('modal-best-score');
        const restartBtn = document.getElementById('restart-btn');

        bestScoreElement.textContent = bestScore;
        updateCoinsDisplay();

        const PIECES = [
            { shape: [[1]], color: 'color-1' },
            { shape: [[1, 1]], color: 'color-2' },
            { shape: [[1], [1]], color: 'color-2' },
            { shape: [[1, 1, 1]], color: 'color-3' },
            { shape: [[1], [1], [1]], color: 'color-3' },
            { shape: [[1, 1], [1, 1]], color: 'color-4' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'color-5' },
            { shape: [[1, 0], [1, 1]], color: 'color-6' },
            { shape: [[0, 1], [1, 1]], color: 'color-6' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'color-7' }
        ];

        let currentPieces = [null, null, null];
        let activeDrag = null;

        // Web Audio Synth Motoru
        let audioCtx = null;
        let pianoTimeout = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startPianoMelody();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- GERÇEKÇİ PİYANO SESİ ALGORİTMASI ---
        function playPianoNote(freq, duration = 1.8) {
            if (!audioCtx || !musicEnabled) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // Sıcak ve yumuşak ton için 'sine' ve 'triangle' hibrit yapısı
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Tuş basış anı (Attack) ve doğal sönümlenme (Decay)
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.03); 
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Dinlendirici, Klasik Akıcı Piyano Melodisi
        function startPianoMelody() {
            // C Majör / A Minör dinlendirici gam frekansları (Do, Re, Mi, Sol, La)
            const melodyNotes = [261.63, 329.63, 392.00, 440.00, 523.25, 659.25, 587.33, 392.00];
            let index = 0;

            function playNext() {
                if (musicEnabled) {
                    const freq = melodyNotes[index % melodyNotes.length];
                    playPianoNote(freq, 2.2);
                    index++;
                }
                // Rastgele doğal ritim aralıkları (Akıcı piyano hissi için)
                const delay = Math.floor(Math.random() * 600) + 900; 
                pianoTimeout = setTimeout(playNext, delay);
            }

            playNext();
        }

        musicBtn.addEventListener('click', () => {
            musicEnabled = !musicEnabled;
            musicBtn.textContent = musicEnabled ? '🎵 Müzik: Açık' : '🔇 Müzik: Kapalı';
        });

        function playPlaceSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.07);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.07);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.07);
        }

        // --- BOMBA PATLAMA SESİ (HEAVY BOMB EXPLOSION) ---
        function playExplosionSound() {
            initAudio();
            if (!audioCtx) return;

            const duration = 0.8;
            
            // 1. Alt Bas Vuruşu (Sub-Bass Boom)
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(160, audioCtx.currentTime);
            subOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);

            subGain.gain.setValueAtTime(1.5, audioCtx.currentTime);
            subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start();
            subOsc.stop(audioCtx.currentTime + duration);

            // 2. Şok Dalgası ve Güçlü Gürültü (Explosion Blast Noise)
            const bufferSize = audioCtx.sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(2.0, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            noise.start();
            noise.stop(audioCtx.currentTime + duration);
        }

        function createBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function renderPiece(piece, container, cellSize = 20) {
            container.innerHTML = '';
            if (!piece) return;
            
            const grid = document.createElement('div');
            grid.classList.add('piece-grid');
            grid.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, ${cellSize}px)`;
            grid.style.gridTemplateRows = `repeat(${piece.shape.length}, ${cellSize}px)`;

            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    const block = document.createElement('div');
                    if (piece.shape[r][c]) {
                        block.classList.add('piece-block', piece.color);
                    }
                    grid.appendChild(block);
                }
            }
            container.appendChild(grid);
        }

        function spawnPieces() {
            for (let i = 0; i < 3; i++) {
                if (!currentPieces[i]) {
                    const randomPiece = PIECES[Math.floor(Math.random() * PIECES.length)];
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
            }
            saveGameState();
            checkGameOver();
        }

        rerollBtn.addEventListener('click', () => {
            initAudio();
            if (coins >= 500) {
                coins -= 500;
                localStorage.setItem('block_breaker_coins', coins);
                updateCoinsDisplay();

                for (let i = 0; i < 3; i++) {
                    const randomPiece = PIECES[Math.floor(Math.random() * PIECES.length)];
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
                saveGameState();
                checkGameOver();
            }
        });

        function updateCoinsDisplay() {
            coinsElement.textContent = `🪙 ${coins}`;
            rerollBtn.disabled = coins < 500;
        }

        function setupDragAndDrop() {
            pieceHolders.forEach(holder => {
                holder.addEventListener('pointerdown', onDragStart, { passive: false });
            });
        }

        function onDragStart(e) {
            initAudio();
            const index = parseInt(e.currentTarget.dataset.index);
            const piece = currentPieces[index];
            if (!piece) return;

            if (e.cancelable) e.preventDefault();

            const clone = document.createElement('div');
            clone.classList.add('dragging');
            
            const boardCell = document.querySelector('.cell');
            const cellSize = boardCell.getBoundingClientRect().width;
            renderPiece(piece, clone, cellSize);
            document.body.appendChild(clone);

            activeDrag = {
                index: index,
                piece: piece,
                element: clone,
                cellSize: cellSize
            };

            updateDragPosition(e.clientX, e.clientY);

            window.addEventListener('pointermove', onDragMove, { passive: false });
            window.addEventListener('pointerup', onDragEnd);
            window.addEventListener('pointercancel', onDragEnd);
        }

        function updateDragPosition(clientX, clientY) {
            if (!activeDrag) return;
            const piece = activeDrag.piece;
            const cellSize = activeDrag.cellSize;
            
            const pieceWidth = piece.shape[0].length * cellSize;
            const pieceHeight = piece.shape.length * cellSize;

            activeDrag.element.style.left = `${clientX - pieceWidth / 2}px`;
            activeDrag.element.style.top = `${clientY - pieceHeight / 2 - 25}px`;

            clearPreview();

            const targetPos = getTargetGridPosition(clientX, clientY);
            if (targetPos) {
                if (canPlace(piece, targetPos.r, targetPos.c)) {
                    drawPreview(piece, targetPos.r, targetPos.c);
                }
            }
        }

        function onDragMove(e) {
            if (e.cancelable) e.preventDefault();
            updateDragPosition(e.clientX, e.clientY);
        }

        function getTargetGridPosition(clientX, clientY) {
            const boardRect = gridElement.getBoundingClientRect();
            const cellSize = (boardRect.width - 16) / BOARD_SIZE;
            const adjustedY = clientY - 25;

            if (
                clientX >= boardRect.left - cellSize &&
                clientX <= boardRect.right + cellSize &&
                adjustedY >= boardRect.top - cellSize &&
                adjustedY <= boardRect.bottom + cellSize
            ) {
                const piece = activeDrag.piece;
                const relativeX = clientX - boardRect.left - 8;
                const relativeY = adjustedY - boardRect.top - 8;

                let col = Math.round((relativeX - (piece.shape[0].length * cellSize) / 2) / cellSize);
                let row = Math.round((relativeY - (piece.shape.length * cellSize) / 2) / cellSize);

                return { r: row, c: col };
            }
            return null;
        }

        function onDragEnd(e) {
            if (!activeDrag) return;

            window.removeEventListener('pointermove', onDragMove);
            window.removeEventListener('pointerup', onDragEnd);
            window.removeEventListener('pointercancel', onDragEnd);

            const targetPos = getTargetGridPosition(e.clientX, e.clientY);
            let placed = false;

            if (targetPos) {
                if (canPlace(activeDrag.piece, targetPos.r, targetPos.c)) {
                    placePiece(activeDrag.piece, targetPos.r, targetPos.c);
                    currentPieces[activeDrag.index] = null;
                    pieceHolders[activeDrag.index].innerHTML = '';
                    placed = true;
                }
            }

            clearPreview();
            activeDrag.element.remove();
            activeDrag = null;

            if (placed) {
                playPlaceSound();
                checkLines();
                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    saveGameState();
                    checkGameOver();
                }
            }
        }

        function canPlace(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        if (
                            targetR < 0 || targetR >= BOARD_SIZE ||
                            targetC < 0 || targetC >= BOARD_SIZE ||
                            grid[targetR][targetC]
                        ) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function drawPreview(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const cell = getCellElement(startR + r, startC + c);
                        if (cell) {
                            cell.classList.add('preview', piece.color);
                        }
                    }
                }
            }
        }

        function clearPreview() {
            document.querySelectorAll('.cell').forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (!grid[r][c]) {
                    if (!cell.classList.contains('exploding-cell')) {
                        cell.className = 'cell';
                    }
                } else {
                    cell.className = `cell filled ${gridColors[r][c]}`;
                }
            });
        }

        function placePiece(piece, startR, startC) {
            let addedScore = 0;
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        grid[targetR][targetC] = 1;
                        gridColors[targetR][targetC] = piece.color;
                        const cell = getCellElement(targetR, targetC);
                        cell.className = `cell filled ${piece.color}`;
                        addedScore += 10;
                    }
                }
            }
            updateScore(score + addedScore);
        }

        function getCellElement(r, c) {
            return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        }

        // --- HAVAİ FİŞEK PATLAMA GÖRSEL EFEKTİ ---
        function createFireworks(cell) {
            const rect = cell.getBoundingClientRect();
            const boardRect = gridElement.getBoundingClientRect();
            const centerX = rect.left - boardRect.left + rect.width / 2;
            const centerY = rect.top - boardRect.top + rect.height / 2;

            const fireworkColors = ['#ff4500', '#f59e0b', '#38bdf8', '#ec4899', '#10b981', '#ffffff', '#fbbf24'];

            const sparkCount = 18; // Yoğun havai fişek parçacığı
            for (let i = 0; i < sparkCount; i++) {
                const spark = document.createElement('div');
                spark.classList.add('spark');
                
                const angle = (Math.PI * 2 / sparkCount) * i + Math.random() * 0.4;
                const distance = 45 + Math.random() * 55; // Uzak yayılım
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance + 20; // Yerçekimi etkisi (+20px düşüş)

                const sparkSize = Math.floor(Math.random() * 6) + 4; // Değişken büyüklük
                spark.style.width = `${sparkSize}px`;
                spark.style.height = `${sparkSize}px`;

                spark.style.left = `${centerX}px`;
                spark.style.top = `${centerY}px`;
                
                const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                spark.style.backgroundColor = color;
                spark.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
                spark.style.setProperty('--tx', `${tx}px`);
                spark.style.setProperty('--ty', `${ty}px`);

                gridElement.appendChild(spark);

                setTimeout(() => spark.remove(), 750);
            }
        }

        function checkLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) {
                    rowsToClear.push(r);
                }
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] !== 1) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            const totalCleared = rowsToClear.length + colsToClear.length;
            if (totalCleared > 0) {
                playExplosionSound();
                let clearSet = new Set();

                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) clearSet.add(`${r},${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) clearSet.add(`${r},${c}`);
                });

                clearSet.forEach(coord => {
                    const [r, c] = coord.split(',').map(Number);
                    grid[r][c] = 0;
                    gridColors[r][c] = null;
                    const cell = getCellElement(r, c);
                    
                    cell.className = 'cell exploding-cell';
                    createFireworks(cell);
                    
                    setTimeout(() => {
                        cell.className = 'cell';
                    }, 400);
                });

                let comboBonus = totalCleared * 100 * totalCleared;
                updateScore(score + comboBonus);

                if (totalCleared > 1) {
                    showCombo(totalCleared);
                }
            }
        }

        function showCombo(count) {
            comboElement.textContent = `COMBO x${count}!`;
            comboElement.style.opacity = '1';
            setTimeout(() => {
                comboElement.style.opacity = '0';
            }, 1200);
        }

        function updateScore(newScore) {
            score = newScore;
            scoreElement.textContent = score;

            const currentThreshold = Math.floor(score / 5000);
            if (currentThreshold > lastCoinThreshold) {
                const earnedCoins = (currentThreshold - lastCoinThreshold) * 1000;
                coins += earnedCoins;
                lastCoinThreshold = currentThreshold;
                localStorage.setItem('block_breaker_coins', coins);
                updateCoinsDisplay();
            }

            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('block_breaker_best', bestScore);
            }
        }

        function checkGameOver() {
            let canMove = false;
            for (let i = 0; i < 3; i++) {
                const piece = currentPieces[i];
                if (piece) {
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (canPlace(piece, r, c)) {
                                canMove = true;
                                break;
                            }
                        }
                        if (canMove) break;
                    }
                }
                if (canMove) break;
            }

            if (!canMove && currentPieces.some(p => p !== null)) {
                setTimeout(() => {
                    finalScoreElement.textContent = score;
                    modalBestScoreElement.textContent = bestScore;
                    gameOverModal.classList.add('active');
                }, 400);
            }
        }

        restartBtn.addEventListener('click', () => {
            gameOverModal.classList.remove('active');
            resetGame();
        });

        // Durumu Kaydet
        function saveGameState() {
            const state = {
                grid: grid,
                gridColors: gridColors,
                score: score,
                currentPieces: currentPieces,
                lastCoinThreshold: lastCoinThreshold
            };
            localStorage.setItem('block_breaker_saved_state', JSON.stringify(state));
        }

        // Durumu Yükle (Devam Et)
        function loadGameState() {
            const saved = localStorage.getItem('block_breaker_saved_state');
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    grid = state.grid;
                    gridColors = state.gridColors;
                    score = state.score;
                    currentPieces = state.currentPieces;
                    lastCoinThreshold = state.lastCoinThreshold || 0;

                    scoreElement.textContent = score;

                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (grid[r][c]) {
                                const cell = getCellElement(r, c);
                                cell.className = `cell filled ${gridColors[r][c]}`;
                            }
                        }
                    }

                    for (let i = 0; i < 3; i++) {
                        if (currentPieces[i]) {
                            renderPiece(currentPieces[i], pieceHolders[i]);
                        }
                    }
                    return true;
                } catch(e) {
                    return false;
                }
            }
            return false;
        }

        // Sıfırdan Oyuna Başla
        function resetGame() {
            grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            currentPieces = [null, null, null];
            lastCoinThreshold = 0;
            
            coins = 0;
            localStorage.setItem('block_breaker_coins', coins);
            updateCoinsDisplay();

            updateScore(0);
            createBoard();
            spawnPieces();
            saveGameState();
        }

        // Oyun Başlatma Mantığı
        createBoard();
        setupDragAndDrop();

        if (!loadGameState()) {
            spawnPieces();
        }
    </script>
</body>
</html>
