f}`;return f}window.addEventListener('pointerdown',initAudio,{once:false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!difficultyModal.classList.contains('active'))pauseGame()});function pauseGame(){isPaused=true;menuTitle.textContent='OYUN DURDURULDU';settingsModal.classList.add('active');if(audioCtx&&audioCtx.state==='running')audioCtx.suspend()}function resumeGame(){isPaused=false;menuTitle.textContent='AYARLAR';settingsModal.classList.remove('active');if(musicEnabled&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function playTone(freq,duration=2.5){if(!audioCtx||!musicEnabled||isPaused)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(0,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.06,audioCtx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+duration)}function startAmbientMusic(){const n=[261.63,329.63,392,493.88,523.25];let i=0;function next(){if(musicEnabled&&audioCtx&&audioCtx.state==='running'&&!isPaused){const f=n[i%n.length];playTone(f,2.2);if(i%3===0)playTone(f*1.25,2);i++}ambientTimer=setTimeout(next,2500)}next()}function syncSettingUI(){toggleMusicBtn.textContent=musicEnabled?'AÇIK':'KAPALI';toggleMusicBtn.className=`toggle-btn ${musicEnabled?'on':''}`;toggleSfxBtn.textContent=sfxEnabled?'AÇIK':'KAPALI';toggleSfxBtn.className=`toggle-btn ${sfxEnabled?'on':''}`}
menuBtn.addEventListener('click',()=>{initAudio();pauseGame();menuTitle.textContent='AYARLAR'});closeMenuBtn.addEventListener('click',resumeGame);toggleMusicBtn.addEventListener('click',()=>{musicEnabled=!musicEnabled;localStorage.setItem('bb_music',JSON.stringify(musicEnabled));syncSettingUI();if(!musicEnabled&&audioCtx)audioCtx.suspend();if(musicEnabled&&audioCtx&&!isPaused)audioCtx.resume()});toggleSfxBtn.addEventListener('click',()=>{sfxEnabled=!sfxEnabled;localStorage.setItem('bb_sfx',JSON.stringify(sfxEnabled));syncSettingUI()});restartGameBtn.addEventListener('click',()=>{resumeGame();settingsModal.classList.remove('active');difficultyModal.classList.add('active')});modalRestartBtn.addEventListener('click',()=>{gameOverModal.classList.remove('active');difficultyModal.classList.add('active')});document.querySelectorAll('.difficulty-btn').forEach(btn=>btn.addEventListener('click',e=>{gameDifficulty=e.currentTarget.dataset.diff;localStorage.setItem('bb_difficulty',gameDifficulty);difficultyModal.classList.remove('active');updateDifficultyUI();resetGame()}));
function playPlaceSound(){if(!sfxEnabled||!audioCtx||isPaused)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(350,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(140,audioCtx.currentTime+.08);g.gain.setValueAtTime(.15,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.01,audioCtx.currentTime+.08);o.start();o.stop(audioCtx.currentTime+.08)}function playExplosionSound(){if(!sfxEnabled||!audioCtx||isPaused)return;const d=.25,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(280,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+d);g.gain.setValueAtTime(.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function playStarSparkleSound(){if(!sfxEnabled||!audioCtx||isPaused)return;[523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>setTimeout(()=>{if(isPaused)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.15)},i*60))}
function createBottomStarBurst(){for(let b=0;b<4;b++)setTimeout(()=>{const x=8+Math.random()*84,y=innerHeight+25,rise=innerHeight*(.28+Math.random()*.22),star=document.createElement('div');star.className='burst-star';star.textContent='★';star.style.left=`${x}%`;star.style.top=`${y}px`;document.body.appendChild(star);requestAnimationFrame(()=>{star.style.transition='transform 700ms cubic-bezier(.16,1,.3,1),opacity 180ms ease-out';star.style.transform=`translateY(-${rise}px) scale(1.25) rotate(180deg)`});setTimeout(()=>{const q=star.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2;star.remove();for(let i=0;i<10;i++){const p=document.createElement('div');p.className='burst-particle';p.textContent=i%2?'✦':'★';p.style.left=`${cx}px`;p.style.top=`${cy}px`;document.body.appendChild(p);const a=Math.PI*2/10*i+(Math.random()-.5)*.25,d=35+Math.random()*55;requestAnimationFrame(()=>{p.style.transition='transform 500ms ease-out,opacity 500ms ease-out';p.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.35) rotate(${Math.random()*360}deg)`;p.style.opacity='0'});setTimeout(()=>p.remove(),550)}},720)},b*170)}
function createGrid(){gridElement.innerHTML='';for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++){const cell=document.createElement('div');cell.classList.add('cell');cell.dataset.row=r;cell.dataset.col=c;gridElement.appendChild(cell)}}function renderGrid(){gridElement.querySelectorAll('.cell').forEach(cell=>{const r=+cell.dataset.row,c=+cell.dataset.col;cell.className='cell';if(grid[r][c]===1)cell.classList.add('filled',gridColors[r][c])})}
const MEDIUM_GAME_POOL=[{shape:[[1]],color:'color-2'},{shape:[[1,1]],color:'color-3'},{shape:[[1],[1]],color:'color-3'},{shape:[[1,1,1]],color:'color-4'},{shape:[[1],[1],[1]],color:'color-4'},{shape:[[1,1],[1,1]],color:'color-5'},{shape:[[1,0],[1,1]],color:'color-6'},{shape:[[0,1],[1,1]],color:'color-7'},{shape:[[1,1,1,1]],color:'color-8'},{shape:[[1,1,1],[1,0,0]],color:'color-1'},{shape:[[1,1,1],[0,0,1]],color:'color-5'},{shape:[[1,1,1],[0,1,0]],color:'color-7'},{shape:[[1,1],[1,0],[1,0]],color:'color-2'}];
function getRandomPiece(){let p;if(gameDifficulty==='hard'){p=HARD_POOL}else if(gameDifficulty==='medium'){const level=Math.min(currentLevel,6);let base=MEDIUM_GAME_POOL.slice(0,Math.min(MEDIUM_GAME_POOL.length,6+level));if(level>=2)base=base.concat(LEVEL_SHAPES.slice(0,Math.min(2,level-1)));if(level>=3)base=base.concat(LEVEL_SHAPES.slice(0,Math.min(4,level)));if(level>=4)base=base.concat(MEDIUM_POOL.slice(4,6));if(level>=5)base=base.concat(MEDIUM_POOL.slice(6));p=base}else{const level=Math.min(currentLevel,6);let base=VERY_EASY_POOL.slice();if(level>=2)base=base.concat(EASY_POOL.slice(1,6));if(level>=3)base=base.concat(EASY_POOL.slice(6));if(level>=4)base=base.concat(LEVEL_SHAPES.slice(0,2));if(level>=5)base=base.concat(LEVEL_SHAPES.slice(2,4));if(level>=6)base=base.concat(LEVEL_SHAPES.slice(4));p=base}return JSON.parse(JSON.stringify(p[Math.floor(Math.random()*p.length)]))}function renderPieceHolder(h,p){h.innerHTML='';if(!p)return;const g=document.createElement('div');g.className='piece-grid';const rows=p.shape.length,cols=p.shape[0].length;g.style.gridTemplateColumns=`repeat(${cols},14px)`;g.style.gridTemplateRows=`repeat(${rows},14px)`;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const b=document.createElement('div');if(p.shape[r][c])b.className=`piece-block ${p.color}`;g.appendChild(b)}h.appendChild(g)}function generateNewPieces(){for(let i=0;i<3;i++)currentPieces[i]=getRandomPiece();renderAllHolders()}function renderAllHolders(){pieceHolders.forEach((h,i)=>{renderPieceHolder(h,currentPieces[i]);if(currentPieces[i]){h.classList.remove('disabled');h.style.visibility='visible'}else h.classList.add('disabled')});renderPieceHolder(holdHolder,heldPiece);if(heldPiece)holdHolder.style.visibility='visible';checkGameOver()}
function triggerArmAnim(a,d=400){orangutanSvg.classList.remove('arms-move','arms-celebrate','arms-throw');void orangutanSvg.offsetWidth;orangutanSvg.classList.add(a);setTimeout(()=>orangutanSvg.classList.remove(a),d)}function triggerBananaEffect(){let cells=[];for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++)if(grid[r][c]===1)cells.push({r,c});if(!cells.length)return;const count=Math.min(cells.length,Math.floor(Math.random()*2)+4),sel=[];for(let i=0;i<count;i++)sel.push(cells.splice(Math.floor(Math.random()*cells.length),1)[0]);const o=orangutanSvg.getBoundingClientRect(),sx=o.left+o.width/2,sy=o.top+o.height/2;sel.forEach((t,i)=>setTimeout(()=>{triggerArmAnim('arms-throw',450);const cell=gridElement.querySelector(`.cell[data-row="${t.r}"][data-col="${t.c}"]`);if(!cell)return;const q=cell.getBoundingClientRect(),tx=q.left+q.width/2,ty=q.top+q.height/2,b=document.createElement('div');b.className='flying-banana';b.textContent='🍌';b.style.left=`${sx}px`;b.style.top=`${sy}px`;document.body.appendChild(b);requestAnimationFrame(()=>b.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(1.2) rotate(360deg)`);setTimeout(()=>{b.remove();if(grid[t.r][t.c]===1){grid[t.r][t.c]=0;gridColors[t.r][t.c]=null;cell.classList.add('exploding-cell');createSparks(cell);playExplosionSound();renderGrid();addScore(50)}},600)},i*250))}
function setupDragAndDrop(){[...pieceHolders,holdHolder].forEach(h=>h.addEventListener('pointerdown',e=>{if(isPaused||difficultyModal.classList.contains('active'))return;const type=h.dataset.type,index=h.dataset.index,p=type==='main'?currentPieces[index]:heldPiece;if(!p)return;initAudio();const dragEl=h.querySelector('.piece-grid').cloneNode(true);dragEl.classList.add('dragging');document.body.appendChild(dragEl);const cols=p.shape[0].length,rows=p.shape.length,cellSize=gridElement.clientWidth/10,width=cols*cellSize,height=rows*cellSize;dragEl.style.gridTemplateColumns=`repeat(${cols},${cellSize}px)`;dragEl.style.gridTemplateRows=`repeat(${rows},${cellSize}px)`;if(type==='main'){currentPieces[index]=null;renderPieceHolder(h,null);h.classList.add('disabled')}else{heldPiece=null;renderPieceHolder(holdHolder,null)}activeDrag={holder:h,type,index:parseInt(index),piece:p,dragEl,cols,rows,cellSize};updateDragPosition(e)}));window.addEventListener('pointermove',e=>{if(!activeDrag)return;updateDragPosition(e);highlightPreview(e)});window.addEventListener('pointerup',e=>{if(!activeDrag)return;clearPreview();const dropped=tryPlacePiece(e);if(!dropped){if(activeDrag.type==='main')currentPieces[activeDrag.index]=activeDrag.piece;else heldPiece=activeDrag.piece;renderAllHolders()}if(activeDrag.dragEl)activeDrag.dragEl.remove();activeDrag=null;saveGameState()})}
function updateDragPosition(e){if(!activeDrag)return;const{dragEl,cols,rows,cellSize}=activeDrag,w=cols*cellSize,h=rows*cellSize;dragEl.style.left=`${e.clientX-w/2}px`;dragEl.style.top=`${e.clientY-h-30}px`}
function getBoardTargetCell(e){const gr=gridElement.getBoundingClientRect(),{cols,rows,cellSize}=activeDrag,w=cols*cellSize,h=rows*cellSize,px=e.clientX,py=e.clientY-h/2-30;if(px<gr.left||px>gr.right||py<gr.top||py>gr.bottom)return null;return{col:Math.floor((px-gr.left-w/2+cellSize/2)/cellSize),row:Math.floor((py-gr.top-h/2+cellSize/2)/cellSize)}}function canPlace(shape,sr,sc){for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++)if(shape[r][c]){const tr=sr+r,tc=sc+c;if(tr<0||tr>=BOARD_SIZE||tc<0||tc>=BOARD_SIZE||grid[tr][tc]===1)return false}return true}
function isShapeOverHold(){const shapeRect=activeDrag?.dragEl?.getBoundingClientRect(),holdRect=holdHolder.getBoundingClientRect();if(!shapeRect)return false;const left=Math.max(shapeRect.left,holdRect.left),right=Math.min(shapeRect.right,holdRect.right),top=Math.max(shapeRect.top,holdRect.top),bottom=Math.min(shapeRect.bottom,holdRect.bottom);if(right<=left||bottom<=top)return false;const overlap=(right-left)*(bottom-top),shapeArea=shapeRect.width*shapeRect.height;return shapeArea>0&&overlap/shapeArea>=0.25}
function highlightPreview(e){clearPreview();const over=isShapeOverHold();if(over&&activeDrag.type==='main'&&canHold){holdHolder.style.background='rgba(56,189,248,.25)';return}else holdHolder.style.background='rgba(56,189,248,.05)';const t=getBoardTargetCell(e);if(!t)return;const{row,col}=t,{piece}=activeDrag;if(canPlace(piece.shape,row,col))for(let r=0;r<piece.shape.length;r++)for(let c=0;c<piece.shape[r].length;c++)if(piece.shape[r][c]){const cell=gridElement.querySelector(`.cell[data-row="${row+r}"][data-col="${col+c}"]`);if(cell)cell.classList.add('preview',piece.color)}}function clearPreview(){gridElement.querySelectorAll('.cell').forEach(c=>{c.classList.remove('preview');ALL_COLORS.forEach(x=>{if(!c.classList.contains('filled'))c.classList.remove(x)})})}
function tryPlacePiece(e){const{type,index,piece}=activeDrag;if(type==='main'&&canHold&&isShapeOverHold()){const temp=heldPiece;heldPiece=piece;currentPieces[index]=temp;canHold=false;if(currentPieces.every(p=>p===null))generateNewPieces();else renderAllHolders();return true}const t=getBoardTargetCell(e);if(!t)return false;const{row,col}=t;if(canPlace(piece.shape,row,col)){let count=0;for(let r=0;r<piece.shape.length;r++)for(let c=0;c<piece.shape[r].length;c++)if(piece.shape[r][c]){grid[row+r][col+c]=1;gridColors[row+r][col+c]=piece.color;count++}addScore(count);playPlaceSound();triggerArmAnim('arms-move',350);canHold=true;renderGrid();checkLines();if(currentPieces.every(p=>p===null))generateNewPieces();else renderAllHolders();return true}return false}
function checkLines(){let rows=[],cols=[];for(let r=0;r<BOARD_SIZE;r++)if(grid[r].every(v=>v===1))rows.push(r);for(let c=0;c<BOARD_SIZE;c++){let full=true;for(let r=0;r<BOARD_SIZE;r++)if(grid[r][c]===0){full=false;break}if(full)cols.push(c)}const n=rows.length+cols.length;if(n>0){lineClearPending=true;playExplosionSound();triggerArmAnim('arms-celebrate',1200);const cells=new Set;rows.forEach(r=>{for(let c=0;c<BOARD_SIZE;c++)cells.add(`${r},${c}`)});cols.forEach(c=>{for(let r=0;r<BOARD_SIZE;r++)cells.add(`${r},${c}`)});cells.forEach(k=>{const[r,c]=k.split(',').map(Number),cell=gridElement.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);if(cell){cell.classList.add('exploding-cell');createSparks(cell)}});setTimeout(()=>{cells.forEach(k=>{const[r,c]=k.split(',').map(Number);grid[r][c]=0;gridColors[r][c]=null});renderGrid();lineClearPending=false;saveGameState();checkGameOver()},250);addScore(n*100*n);if(n>1){comboElement.textContent=`COMBO x${n}!`;comboElement.style.opacity='1';setTimeout(()=>comboElement.style.opacity='0',1500)}}}
function createSparks(cell){const q=cell.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,color=getComputedStyle(cell).backgroundColor;for(let i=0;i<8;i++){const s=document.createElement('div');s.className='spark';s.style.backgroundColor=color;s.style.color=color;s.style.width='6px';s.style.height='6px';s.style.left=`${x}px`;s.style.top=`${y}px`;const a=Math.PI*2/8*i+(Math.random()*.4-.2),d=30+Math.random()*40;s.style.setProperty('--tx',`${Math.cos(a)*d}px`);s.style.setProperty('--ty',`${Math.sin(a)*d}px`);document.body.appendChild(s);setTimeout(()=>s.remove(),650)}}
function shuffleHardBoard(){const filled=[];for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++)if(grid[r][c]===1)filled.push({color:gridColors[r][c]});if(filled.length<2)return;for(let i=filled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filled[i],filled[j]]=[filled[j],filled[i]]}const positions=[];for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++)if(grid[r][c]===1)positions.push([r,c]);for(let i=positions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]}grid=Array(BOARD_SIZE).fill().map(()=>Array(BOARD_SIZE).fill(0));gridColors=Array(BOARD_SIZE).fill().map(()=>Array(BOARD_SIZE).fill(null));positions.forEach(([r,c],i)=>{grid[r][c]=1;gridColors[r][c]=filled[i].color});renderGrid()}function handleLevelProgress(){const nextLevel=Math.floor(score/5000)+1;if(nextLevel>currentLevel){currentLevel=nextLevel;updateDifficultyUI();if(gameDifficulty==='hard')shuffleHardBoard();generateNewPieces();const sub=gameDifficulty==='easy'?'Kolay → Daha zor':gameDifficulty==='medium'?'Orta → Daha zor':'Zor → Tahta değişti';triggerLevelUpAnimation(`LEVEL ${currentLevel}`,sub);saveGameState()}}function addScore(pts){score+=pts;scoreElement.textContent=score;if(score>bestScore){bestScore=score;bestScoreElement.textContent=bestScore;localStorage.setItem('block_breaker_best',bestScore)}if(Math.floor(score/100)>lastCoinThreshold){const d=Math.floor(score/100)-lastCoinThreshold;coins+=d*50;lastCoinThreshold=Math.floor(score/100);updateCoinsDisplay()}if(Math.floor(score/3000)>lastBananaThreshold){lastBananaThreshold=Math.floor(score/3000);triggerBananaEffect()}handleLevelProgress();saveGameState()}
function updateCoinsDisplay(){coinsElement.textContent=`🪙 ${coins}`;rerollBtn.disabled=coins<500}function triggerLevelUpAnimation(textValue,sub){playStarSparkleSound();createBottomStarBurst();levelOverlay.innerHTML='';for(let i=0;i<20;i++){const s=document.createElement('div');s.className='shooting-star';s.style.bottom=`${Math.random()*15}%`;s.style.left=`${Math.random()*100}%`;s.style.animationDelay=`${Math.random()*.7}s`;levelOverlay.appendChild(s)}const wrap=document.createElement('div');wrap.style.display='flex';wrap.style.flexDirection='column';wrap.style.alignItems='center';const text=document.createElement('div');text.className='level-up-text';text.textContent=textValue||'BAŞLAYALIM!';wrap.appendChild(text);if(sub){const st=document.createElement('div');st.className='level-subtext';st.textContent=sub;wrap.appendChild(st)}levelOverlay.appendChild(wrap);setTimeout(()=>levelOverlay.innerHTML='',2000)}rerollBtn.addEventListener('click',()=>{if(coins>=500){coins-=500;updateCoinsDisplay();generateNewPieces();saveGameState()}});
function checkGameOver(){if(lineClearPending)return;let pieces=currentPieces.filter(p=>p!==null);if(heldPiece)pieces.push(heldPiece);if(!pieces.length)return;let move=false;for(const p of pieces){for(let r=0;r<BOARD_SIZE;r++){for(let c=0;c<BOARD_SIZE;c++){if(canPlace(p.shape,r,c)){move=true;break}}if(move)break}if(move)break}if(!move){stopTimer();clearSavedGame();finalScoreElement.textContent=score;finalTimeElement.textContent=updateTimerDisplay();modalBestScoreElement.textContent=bestScore;gameOverModal.classList.add('active')}}function resetGame(){clearSavedGame();grid=Array(BOARD_SIZE).fill().map(()=>Array(BOARD_SIZE).fill(0));gridColors=Array(BOARD_SIZE).fill().map(()=>Array(BOARD_SIZE).fill(null));score=0;coins=0;totalSeconds=0;lastCoinThreshold=0;lastBananaThreshold=0;currentLevel=1;scoreElement.textContent=0;updateCoinsDisplay();heldPiece=null;canHold=true;updateDifficultyUI();updateTimerDisplay();startTimer();renderGrid();generateNewPieces();triggerLevelUpAnimation('LEVEL 1',gameDifficulty==='easy'?'Kolay Seviye':gameDifficulty==='medium'?'Orta Seviye':'Usta İşi');saveGameState()}function initGame(){createGrid();if(!loadGameState())stopTimer();else difficultyModal.classList.remove('active');setupDragAndDrop()}bestScoreElement.textContent=bestScore;syncSettingUI();updateDifficultyUI();initGame();
