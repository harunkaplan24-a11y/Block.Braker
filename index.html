<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oyun</title>
  <style>
    /* Genel Sıfırlama ve Gövde */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Üst Bar Tasarımı */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #1f1f1f;
      border-bottom: 2px solid #333;
    }

    /* Sol Taraf: Menü Butonu */
    .menu-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background-color: #ff9800;
      color: #fff;
      border: none;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .menu-btn:hover {
      background-color: #e68a00;
    }

    /* Sağ Taraf: Skor ve Altında Dakika */
    .stats-container {
      display: flex;
      flex-direction: column; /* Skor üstte, dakika altta */
      align-items: flex-end;  /* Sağa hizalı */
      gap: 4px;
    }

    .stat-item {
      font-size: 16px;
      font-weight: bold;
      color: #e0e0e0;
    }

    .stat-item span {
      color: #4caf50; /* Sayılar için yeşil renk */
    }

    /* Oyun Alanı */
    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      background-color: #000;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <!-- ÜST BAR (MENÜ, SKOR VE DAKİKA Sayacı) -->
  <div class="top-bar">
    <!-- Sol Taraf: Menü Butonu -->
    <button id="menu-btn" class="menu-btn">Menü</button>

    <!-- Sağ Taraf: Skor ve Altında Dakika Sayacı -->
    <div class="stats-container">
      <div id="score-display" class="stat-item">Skor: <span id="score">0</span></div>
      <div id="time-display" class="stat-item">Süre: <span id="timer">00:00</span></div>
    </div>
  </div>

  <!-- OYUN EKRANI (Canvas Alanı) -->
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <!-- JAVASCRIPT KODLARI -->
  <script>
    // ----------------------------------------------------
    // 1. DAKİKA / SÜRE SAYACI MANTIĞI
    // ----------------------------------------------------
    let totalSeconds = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        totalSeconds++;
        
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        // Çift haneli formatlama (Örn: 01:05)
        const formattedMinutes = String(minutes).padStart(2, '0');
        const formattedSeconds = String(seconds).padStart(2, '0');

        document.getElementById('timer').textContent = `${formattedMinutes}:${formattedSeconds}`;
      }, 1000);
    }

    // ----------------------------------------------------
    // 2. SKOR GÜNCELLEME VE MENÜ BUTONU İŞLEVLERİ
    // ----------------------------------------------------
    let score = 0;

    // Skorunuz arttığında çağıracağınız fonksiyon:
    function updateScore(points) {
      score += points;
      document.getElementById('score').textContent = score;
    }

    // Menü butonuna tıklama olayı
    document.getElementById('menu-btn').addEventListener('click', () => {
      alert("Menü açıldı!");
      // Buraya kendi menü açma/duraklatma mantığınızı ekleyebilirsiniz.
    });

    // Sayfa yüklendiğinde sayacı başlat
    window.addEventListener('load', () => {
      startTimer();
    });
  </script>

</body>
</html>
