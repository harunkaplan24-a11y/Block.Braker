<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Breaker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-container {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .combo-badge {
            font-size: 14px;
            font-weight: bold;
            color: #f59e0b;
            height: 20px;
            transition: opacity 0.3s;
            opacity: 0;
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
        }
        .game-board-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 10px;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
            width: 100%;
        }
        .cell {
            background-color: #334155;
            border-radius: 4px;
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
            position: relative;
        }
        .cell.filled {
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.8), 0 0 12px currentColor;
        }
        .cell.preview {
            opacity: 0.6;
            transform: scale(0.95);
            box-shadow: inset 0 0 5px #fff;
        }
        .pieces-container {
            width: 100%;
            max-width: 420px;
            height: 140px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #1e293b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .piece-holder {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .piece-grid {
            display: grid;
            gap: 2px;
        }
        .piece-block {
            border-radius: 3px;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.6);
        }
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: scale(1.05);
            opacity: 0.95;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        }

        /* Canlı ve Parlak Renkler (Neon Işık Efektli) */
        .color-1 { background-color: #ef4444; color: #ef4444; }
        .color-2 { background-color: #3b82f6; color: #3b82f6; }
        .color-3 { background-color: #10b981; color: #10b981; }
        .color-4 { background-color: #f59e0b; color: #f59e0b; }
        .color-5 { background-color: #8b5cf6; color: #8b5cf6; }
        .color-6 { background-color: #ec4899; color: #ec4899; }
        .color-7 { background-color: #06b6d4; color: #06b6d4; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); opacity: 0.9; }
            100% { transform: scale(0); opacity: 0; }
        }
        .clearing {
            animation: pop 0.3s forwards;
        }
    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <span class="score-label">Skor</span>
            <span id="score" class="score-value">0</span>
        </div>
        <div id="combo" class="combo-badge">COMBO x2!</div>
        <div class="score-container" style="align-items: flex-end;">
            <span class="score-label">En Yüksek</span>
            <span id="best-score" class="score-value" style="color: #cbd5e1;">0</span>
        </div>
    </header>

    <div class="game-board-wrapper">
        <div id="grid"></div>
    </div>

    <div class="pieces-container" id="pieces-container">
        <div class="piece-holder" data-index="0"></div>
        <div class="piece-holder" data-index="1"></div>
        <div class="piece-holder" data-index="2"></div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let bestScore = localStorage.getItem('block_breaker_best') || 0;
        
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const comboElement = document.getElementById('combo');
        const pieceHolders = document.querySelectorAll('.piece-holder');

        bestScoreElement.textContent = bestScore;

        const PIECES = [
            { shape: [[1]], color: 'color-1' },
            { shape: [[1, 1]], color: 'color-2' },
            { shape: [[1], [1]], color: 'color-2' },
            { shape: [[1, 1, 1]], color: 'color-3' },
            { shape: [[1], [1], [1]], color: 'color-3' },
            { shape: [[1, 1], [1, 1]], color: 'color-4' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'color-5' },
            { shape: [[1, 0], [1, 1]], color: 'color-6' },
            { shape: [[0, 1], [1, 1]], color: 'color-6' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'color-7' }
        ];

        let currentPieces = [null, null, null];
        let activeDrag = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'place') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'clear') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        function createBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function renderPiece(piece, container, cellSize = 22) {
            container.innerHTML = '';
            if (!piece) return;
            
            const grid = document.createElement('div');
            grid.classList.add('piece-grid');
            grid.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, ${cellSize}px)`;
            grid.style.gridTemplateRows = `repeat(${piece.shape.length}, ${cellSize}px)`;

            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    const block = document.createElement('div');
                    if (piece.shape[r][c]) {
                        block.classList.add('piece-block', piece.color);
                    }
                    grid.appendChild(block);
                }
            }
            container.appendChild(grid);
        }

        function spawnPieces() {
            for (let i = 0; i < 3; i++) {
                if (!currentPieces[i]) {
                    const randomPiece = PIECES[Math.floor(Math.random() * PIECES.length)];
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
            }
            checkGameOver();
        }

        function setupDragAndDrop() {
            pieceHolders.forEach(holder => {
                holder.addEventListener('pointerdown', onDragStart);
            });
        }

        function onDragStart(e) {
            const index = parseInt(e.currentTarget.dataset.index);
            const piece = currentPieces[index];
            if (!piece) return;

            e.preventDefault();

            const clone = document.createElement('div');
            clone.classList.add('dragging');
            
            const boardCell = document.querySelector('.cell');
            const cellSize = boardCell.getBoundingClientRect().width;
            renderPiece(piece, clone, cellSize);
            document.body.appendChild(clone);

            activeDrag = {
                index: index,
                piece: piece,
                element: clone,
                cellSize: cellSize
            };

            updateDragPosition(e.clientX, e.clientY);

            window.addEventListener('pointermove', onDragMove);
            window.addEventListener('pointerup', onDragEnd);
            window.addEventListener('pointercancel', onDragEnd);
        }

        function updateDragPosition(clientX, clientY) {
            if (!activeDrag) return;
            const piece = activeDrag.piece;
            const cellSize = activeDrag.cellSize;
            
            const pieceWidth = piece.shape[0].length * cellSize;
            const pieceHeight = piece.shape.length * cellSize;

            // Görseli imlecin/parmağın tam ortasına hizala
            activeDrag.element.style.left = `${clientX - pieceWidth / 2}px`;
            activeDrag.element.style.top = `${clientY - pieceHeight / 2}px`;

            clearPreview();

            // Bırakılacak hedef matris hücresini hesapla
            const targetPos = getTargetGridPosition(clientX, clientY);
            if (targetPos) {
                if (canPlace(piece, targetPos.r, targetPos.c)) {
                    drawPreview(piece, targetPos.r, targetPos.c);
                }
            }
        }

        function onDragMove(e) {
            updateDragPosition(e.clientX, e.clientY);
        }

        function getTargetGridPosition(clientX, clientY) {
            const boardRect = gridElement.getBoundingClientRect();
            
            // Eğer dokunulan/sürüklenen alan tahta sınırları içindeyse
            if (
                clientX >= boardRect.left &&
                clientX <= boardRect.right &&
                clientY >= boardRect.top &&
                clientY <= boardRect.bottom
            ) {
                const cellSize = boardRect.width / BOARD_SIZE;
                const piece = activeDrag.piece;

                // Parmak ucunun denk geldiği hücre
                let touchCol = Math.floor((clientX - boardRect.left) / cellSize);
                let touchRow = Math.floor((clientY - boardRect.top) / cellSize);

                // Şeklin sol üst hücresine göre hizalama hesaplaması (Ofset düzeltme)
                let startR = touchRow - Math.floor(piece.shape.length / 2);
                let startC = touchCol - Math.floor(piece.shape[0].length / 2);

                return { r: startR, c: startC };
            }
            return null;
        }

        function onDragEnd(e) {
            if (!activeDrag) return;

            window.removeEventListener('pointermove', onDragMove);
            window.removeEventListener('pointerup', onDragEnd);
            window.removeEventListener('pointercancel', onDragEnd);

            const targetPos = getTargetGridPosition(e.clientX, e.clientY);
            let placed = false;

            if (targetPos) {
                if (canPlace(activeDrag.piece, targetPos.r, targetPos.c)) {
                    placePiece(activeDrag.piece, targetPos.r, targetPos.c);
                    currentPieces[activeDrag.index] = null;
                    pieceHolders[activeDrag.index].innerHTML = '';
                    placed = true;
                }
            }

            clearPreview();
            activeDrag.element.remove();
            activeDrag = null;

            if (placed) {
                playSound('place');
                checkLines();
                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    checkGameOver();
                }
            }
        }

        function canPlace(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        if (
                            targetR < 0 || targetR >= BOARD_SIZE ||
                            targetC < 0 || targetC >= BOARD_SIZE ||
                            grid[targetR][targetC]
                        ) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function drawPreview(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const cell = getCellElement(startR + r, startC + c);
                        if (cell) {
                            cell.classList.add('preview', piece.color);
                        }
                    }
                }
            }
        }

        function clearPreview() {
            document.querySelectorAll('.cell').forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (!grid[r][c]) {
                    cell.className = 'cell';
                } else {
                    cell.className = `cell filled ${gridColors[r][c]}`;
                }
            });
        }

        function placePiece(piece, startR, startC) {
            let addedScore = 0;
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        grid[targetR][targetC] = 1;
                        gridColors[targetR][targetC] = piece.color;
                        const cell = getCellElement(targetR, targetC);
                        cell.className = `cell filled ${piece.color}`;
                        addedScore += 10;
                    }
                }
            }
            updateScore(score + addedScore);
        }

        function getCellElement(r, c) {
            return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        }

        function checkLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) {
                    rowsToClear.push(r);
                }
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] !== 1) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            const totalCleared = rowsToClear.length + colsToClear.length;
            if (totalCleared > 0) {
                playSound('clear');
                let clearSet = new Set();

                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) clearSet.add(`${r},${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) clearSet.add(`${r},${c}`);
                });

                clearSet.forEach(coord => {
                    const [r, c] = coord.split(',').map(Number);
                    grid[r][c] = 0;
                    gridColors[r][c] = null;
                    const cell = getCellElement(r, c);
                    cell.classList.add('clearing');
                    setTimeout(() => {
                        cell.className = 'cell';
                    }, 300);
                });

                let comboBonus = totalCleared * 100 * totalCleared;
                updateScore(score + comboBonus);

                if (totalCleared > 1) {
                    showCombo(totalCleared);
                }
            }
        }

        function showCombo(count) {
            comboElement.textContent = `COMBO x${count}!`;
            comboElement.style.opacity = '1';
            setTimeout(() => {
                comboElement.style.opacity = '0';
            }, 1200);
        }

        function updateScore(newScore) {
            score = newScore;
            scoreElement.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('block_breaker_best', bestScore);
            }
        }

        function checkGameOver() {
            let canMove = false;
            for (let i = 0; i < 3; i++) {
                const piece = currentPieces[i];
                if (piece) {
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (canPlace(piece, r, c)) {
                                canMove = true;
                                break;
                            }
                        }
                        if (canMove) break;
                    }
                }
                if (canMove) break;
            }

            if (!canMove && currentPieces.some(p => p !== null)) {
                setTimeout(() => {
                    alert(`Oyun Bitti!\nToplam Skor: ${score}`);
                    resetGame();
                }, 500);
            }
        }

        function resetGame() {
            grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            currentPieces = [null, null, null];
            updateScore(0);
            createBoard();
            spawnPieces();
        }

        createBoard();
        spawnPieces();
        setupDragAndDrop();
    </script>
</body>
</html>
