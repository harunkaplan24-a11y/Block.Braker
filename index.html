<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Breaker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><rect x='15' y='15' width='32' height='32' rx='6' fill='%2338bdf8'/><rect x='53' y='15' width='32' height='32' rx='6' fill='%23f59e0b'/><rect x='15' y='53' width='32' height='32' rx='6' fill='%23ec4899'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .score-container {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }
        .level-value {
            font-size: 20px;
            font-weight: bold;
            color: #a855f7;
        }
        .coin-value {
            font-size: 20px;
            font-weight: bold;
            color: #f59e0b;
        }
        .time-value {
            font-size: 14px;
            font-weight: bold;
            color: #10b981;
            margin-top: 2px;
        }
        .top-controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
        }
        .icon-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .icon-btn:active { background: #334155; }

        .combo-badge {
            font-size: 13px;
            font-weight: bold;
            color: #f43f5e;
            height: 20px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .orangutan-stage {
            position: absolute;
            top: -75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .orangutan-svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
        }

        /* Yalnızca kollara uygulanacak animasyon sınıfları */
        .arm-left-group {
            transform-origin: 30px 55px;
            transition: transform 0.2s ease-out;
        }
        .arm-right-group {
            transform-origin: 70px 55px;
            transition: transform 0.2s ease-out;
        }

        /* Blok Koyma Animasyonu (Kollar sallanır) */
        .arms-move .arm-left-group { animation: armMoveLeft 0.35s ease-in-out; }
        .arms-move .arm-right-group { animation: armMoveRight 0.35s ease-in-out; }

        @keyframes armMoveLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-25deg); }
        }
        @keyframes armMoveRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(25deg); }
        }

        /* Çizgi Patlatma / Sevinç Animasyonu (Kollar havaya kalkar) */
        .arms-celebrate .arm-left-group { animation: armCelebrateLeft 0.6s ease-in-out 2; }
        .arms-celebrate .arm-right-group { animation: armCelebrateRight 0.6s ease-in-out 2; }

        @keyframes armCelebrateLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-120deg); }
        }
        @keyframes armCelebrateRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(120deg); }
        }

        /* Muz Atma Animasyonu (Sağ kol gerilip fırlatır) */
        .arms-throw .arm-right-group { animation: armThrowRight 0.6s ease-in-out; }

        @keyframes armThrowRight {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(-60deg); }
            60% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* Belirgin Uçan Muz Efekti */
        .flying-banana {
            position: absolute;
            top: 20px;
            left: 65px;
            font-size: 52px;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            animation: bananaFly 1.1s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }

        @keyframes bananaFly {
            0% {
                transform: translate(0, 0) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
                transform: translate(15px, 20px) scale(1.4) rotate(120deg);
            }
            100% {
                transform: translate(-30px, 260px) scale(1) rotate(720deg);
                opacity: 0;
            }
        }

        .game-board-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 10px;
            margin-top: 50px;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
        }
        .cell {
            background-color: #334155;
            border-radius: 4px;
            transition: background-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
            position: relative;
        }

        .cell.filled { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
        .cell.preview { opacity: 0.5; transform: scale(0.95); }

        .bottom-panel {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 10px 10px 15px 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pieces-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }
        .hold-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-right: 8px;
            border-right: 2px dashed #334155;
        }
        .hold-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .pieces-container {
            flex: 1;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .piece-holder {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .piece-holder.hold-box {
            border: 2px dashed #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        .piece-holder.disabled { opacity: 0.4; pointer-events: none; }
        .piece-grid { display: grid; gap: 2px; }
        .piece-block { border-radius: 3px; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2); }
        
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.95;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            will-change: transform, left, top;
        }

        .reroll-btn {
            background: #d97706;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }
        .reroll-btn:active { transform: scale(0.95); }
        .reroll-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .color-1 { background-color: #e11d48; color: #e11d48; }
        .color-2 { background-color: #2563eb; color: #2563eb; }
        .color-3 { background-color: #059669; color: #059669; }
        .color-4 { background-color: #d97706; color: #d97706; }
        .color-5 { background-color: #7c3aed; color: #7c3aed; }
        .color-6 { background-color: #db2777; color: #db2777; }
        .color-7 { background-color: #0891b2; color: #0891b2; }
        .color-8 { background-color: #9333ea; color: #9333ea; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 25px 20px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .setting-label {
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.on { background: #059669; color: #ffffff; }

        .menu-action-btn {
            background: #dc2626;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .menu-action-btn:active { transform: scale(0.96); }

        .close-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        .level-up-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rising-star {
            position: absolute;
            font-size: 28px;
            animation: riseUp 1.5s linear forwards;
            bottom: -50px;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .level-up-text {
            font-size: 48px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 20px #eab308, 0 0 40px #ca8a04;
            animation: textPop 1.8s ease-out forwards;
            letter-spacing: 2px;
        }

        @keyframes textPop {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1.2); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: fireworkSpark 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fireworkSpark {
            0% { transform: translate(0, 0) scale(1.2); opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .exploding-cell {
            transform: scale(0.85);
            opacity: 0.2;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
        }
    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <span class="score-label">Skor</span>
            <span id="score" class="score-value">0</span>
            <span id="timer" class="time-value">⏱️ 00:00</span>
        </div>
        <div class="score-container" style="align-items: center;">
            <span class="score-label">Level</span>
            <span id="level" class="level-value">1</span>
        </div>
        <div class="score-container" style="align-items: center;">
            <span class="score-label">Coin</span>
            <span id="coins" class="coin-value">🪙 0</span>
        </div>
        <div class="score-container" style="align-items: flex-end;">
            <span class="score-label">En Yüksek</span>
            <span id="best-score" class="score-value" style="color: #cbd5e1;">0</span>
        </div>
    </header>

    <div class="top-controls">
        <button id="menu-btn" class="icon-btn">⚙️ Menü</button>
    </div>

    <div id="combo" class="combo-badge">COMBO x2!</div>

    <div class="game-board-wrapper">
        <div class="orangutan-stage" id="orangutan-stage">
            <svg id="orangutan-svg" class="orangutan-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Gövde -->
                <ellipse cx="50" cy="65" rx="26" ry="22" fill="#a0522d"/>
                <ellipse cx="50" cy="66" rx="18" ry="14" fill="#d2b48c"/>
                
                <!-- Bacaklar -->
                <ellipse cx="32" cy="82" rx="10" ry="6" fill="#8b4513"/>
                <ellipse cx="68" cy="82" rx="10" ry="6" fill="#8b4513"/>

                <!-- Sol Kol & El -->
                <g class="arm-left-group">
                    <path d="M 30 55 Q 12 35 18 18" stroke="#8b4513" stroke-width="10" stroke-linecap="round" fill="none"/>
                    <circle cx="18" cy="16" r="7" fill="#d2b48c"/>
                </g>

                <!-- Sağ Kol & El -->
                <g class="arm-right-group">
                    <path d="M 70 55 Q 88 45 82 25" stroke="#8b4513" stroke-width="10" stroke-linecap="round" fill="none"/>
                    <circle cx="82" cy="23" r="7" fill="#d2b48c"/>
                </g>

                <!-- Kulaklar -->
                <circle cx="28" cy="38" r="8" fill="#8b4513"/>
                <circle cx="28" cy="38" r="4" fill="#d2b48c"/>
                <circle cx="72" cy="38" r="8" fill="#8b4513"/>
                <circle cx="72" cy="38" r="4" fill="#d2b48c"/>

                <!-- Kafa -->
                <circle cx="50" cy="38" r="22" fill="#a0522d"/>
                <!-- Yüz Maskesi -->
                <ellipse cx="50" cy="42" rx="15" ry="12" fill="#d2b48c"/>

                <!-- Gözler -->
                <circle cx="43" cy="36" r="3" fill="#000"/>
                <circle cx="57" cy="36" r="3" fill="#000"/>
                <circle cx="44" cy="35" r="1" fill="#fff"/>
                <circle cx="58" cy="35" r="1" fill="#fff"/>

                <!-- Burun & Ağız -->
                <ellipse cx="50" cy="43" rx="4" ry="2.5" fill="#5c2c0c"/>
                <path d="M 44 47 Q 50 52 56 47" stroke="#5c2c0c" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
        </div>
        <div id="grid"></div>
    </div>

    <div class="bottom-panel">
        <div class="pieces-area">
            <div class="hold-section">
                <span class="hold-title">📦 Yedek</span>
                <div class="piece-holder hold-box" id="hold-holder" data-type="hold"></div>
            </div>

            <div class="pieces-container" id="pieces-container">
                <div class="piece-holder" data-index="0" data-type="main"></div>
                <div class="piece-holder" data-index="1" data-type="main"></div>
                <div class="piece-holder" data-index="2" data-type="main"></div>
            </div>
        </div>
        
        <button id="reroll-btn" class="reroll-btn">
            🔄 Şekil Değiştir (500 🪙)
        </button>
    </div>

    <div id="level-overlay" class="level-up-container"></div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" id="menu-title">Ayarlar</h2>
            
            <div class="menu-setting-row">
                <span class="setting-label">🎵 Müzik</span>
                <button id="toggle-music" class="toggle-btn on">AÇIK</button>
            </div>

            <div class="menu-setting-row">
                <span class="setting-label">🔊 Ses Efektleri</span>
                <button id="toggle-sfx" class="toggle-btn on">AÇIK</button>
            </div>

            <button id="restart-game-btn" class="menu-action-btn">🔄 Oyunu Yeniden Başlat</button>
            <button id="close-menu-btn" class="close-btn">Devam Et</button>
        </div>
    </div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" style="color: #ef4444;">Oyun Bitti</h2>
            <div style="background: #0f172a; border-radius: 12px; padding: 15px; margin: 15px 0;">
                <div style="font-size: 12px; color: #94a3b8; text-transform: uppercase;">Skorun</div>
                <div id="final-score" style="font-size: 36px; font-weight: bold; color: #38bdf8;">0</div>
                <div style="font-size: 13px; color: #10b981; margin-top: 5px;">Geçen Süre: <span id="final-time">00:00</span></div>
            </div>
            <div style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px;">
                En Yüksek Skor: <strong id="modal-best-score" style="color: #38bdf8;">0</strong>
            </div>
            <button id="modal-restart-btn" class="menu-action-btn" style="background: #0284c7;">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let coins = 0;
        let currentLevel = 1;
        let bestScore = parseInt(localStorage.getItem('block_breaker_best')) || 0;
        let lastCoinThreshold = 0;
        let lastBananaThreshold = 0;
        let isPaused = false;

        let totalSeconds = 0;
        let gameTimerInterval = null;

        let musicEnabled = JSON.parse(localStorage.getItem('bb_music') ?? 'true');
        let sfxEnabled = JSON.parse(localStorage.getItem('bb_sfx') ?? 'true');

        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const levelElement = document.getElementById('level');
        const coinsElement = document.getElementById('coins');
        const bestScoreElement = document.getElementById('best-score');
        const comboElement = document.getElementById('combo');
        const rerollBtn = document.getElementById('reroll-btn');
        const menuBtn = document.getElementById('menu-btn');
        const pieceHolders = document.querySelectorAll('.piece-holder[data-type="main"]');
        const holdHolder = document.getElementById('hold-holder');
        const levelOverlay = document.getElementById('level-overlay');
        const orangutanSvg = document.getElementById('orangutan-svg');
        const orangutanStage = document.getElementById('orangutan-stage');
        
        const settingsModal = document.getElementById('settings-modal');
        const menuTitle = document.getElementById('menu-title');
        const toggleMusicBtn = document.getElementById('toggle-music');
        const toggleSfxBtn = document.getElementById('toggle-sfx');
        const restartGameBtn = document.getElementById('restart-game-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');

        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const finalTimeElement = document.getElementById('final-time');
        const modalBestScoreElement = document.getElementById('modal-best-score');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        bestScoreElement.textContent = bestScore;
        updateCoinsDisplay();
        syncSettingUI();

        const ALL_COLORS = ['color-1', 'color-2', 'color-3', 'color-4', 'color-5', 'color-6', 'color-7', 'color-8'];

        const PIECES_EASY = [
            { shape: [[1, 1]], color: 'color-2' },
            { shape: [[1], [1]], color: 'color-2' },
            { shape: [[1, 1, 1]], color: 'color-3' },
            { shape: [[1], [1], [1]], color: 'color-3' },
            { shape: [[1, 1], [1, 1]], color: 'color-4' },
            { shape: [[1, 0], [1, 1]], color: 'color-6' }
        ];

        const PIECES_MEDIUM = [
            { shape: [[1, 1, 1, 1]], color: 'color-8' },
            { shape: [[1], [1], [1], [1]], color: 'color-8' },
            { shape: [[1, 1, 1], [1, 0, 0]], color: 'color-1' },
            { shape: [[1, 1, 1], [0, 0, 1]], color: 'color-5' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'color-7' }
        ];

        const PIECES_HARD = [
            { shape: [[1, 1, 1, 1, 1]], color: 'color-7' },
            { shape: [[1], [1], [1], [1], [1]], color: 'color-7' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'color-5' }
        ];

        let currentPieces = [null, null, null];
        let heldPiece = null;
        let canHold = true;
        let activeDrag = null;

        let audioCtx = null;
        let ambientTimer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startAmbientMusic();
            }
            if (audioCtx.state === 'suspended' && !isPaused) {
                audioCtx.resume();
            }
        }

        function startTimer() {
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            gameTimerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function stopTimer() {
            if (gameTimerInterval) {
                clearInterval(gameTimerInterval);
                gameTimerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            const formatted = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            timerElement.textContent = `⏱️ ${formatted}`;
            return formatted;
        }

        window.addEventListener('pointerdown', initAudio, { once: false });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                pauseGame();
            }
        });

        function pauseGame() {
            isPaused = true;
            menuTitle.textContent = "OYUN DURDURULDU";
            settingsModal.classList.add('active');
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend();
            }
        }

        function resumeGame() {
            isPaused = false;
            menuTitle.textContent = "AYARLAR";
            settingsModal.classList.remove('active');
            if (musicEnabled && audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 2.5) {
            if (!audioCtx || !musicEnabled || isPaused) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        function startAmbientMusic() {
            const notes = [261.63, 329.63, 392.00, 493.88, 523.25];
            let idx = 0;

            function nextNote() {
                if (musicEnabled && audioCtx && audioCtx.state === 'running' && !isPaused) {
                    const freq = notes[idx % notes.length];
                    playTone(freq, 2.2);
                    if (idx % 3 === 0) playTone(freq * 1.25, 2.0);
                    idx++;
                }
                ambientTimer = setTimeout(nextNote, 2500);
            }
            nextNote();
        }

        function syncSettingUI() {
            toggleMusicBtn.textContent = musicEnabled ? 'AÇIK' : 'KAPALI';
            toggleMusicBtn.className = `toggle-btn ${musicEnabled ? 'on' : ''}`;

            toggleSfxBtn.textContent = sfxEnabled ? 'AÇIK' : 'KAPALI';
            toggleSfxBtn.className = `toggle-btn ${sfxEnabled ? 'on' : ''}`;
        }

        menuBtn.addEventListener('click', () => {
            initAudio();
            pauseGame();
            menuTitle.textContent = "AYARLAR";
        });

        closeMenuBtn.addEventListener('click', () => {
            resumeGame();
        });

        toggleMusicBtn.addEventListener('click', () => {
            musicEnabled = !musicEnabled;
            localStorage.setItem('bb_music', JSON.stringify(musicEnabled));
            syncSettingUI();
            if (!musicEnabled && audioCtx) audioCtx.suspend();
            if (musicEnabled && audioCtx && !isPaused) audioCtx.resume();
        });

        toggleSfxBtn.addEventListener('click', () => {
            sfxEnabled = !sfxEnabled;
            localStorage.setItem('bb_sfx', JSON.stringify(sfxEnabled));
            syncSettingUI();
        });

        restartGameBtn.addEventListener('click', () => {
            resumeGame();
            resetGame();
        });

        modalRestartBtn.addEventListener('click', () => {
            gameOverModal.classList.remove('active');
            resetGame();
        });

        function playPlaceSound() {
            if (!sfxEnabled || !audioCtx || isPaused) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playExplosionSound() {
            if (!sfxEnabled || !audioCtx || isPaused) return;
            const duration = 0.25;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playStarSparkleSound() {
            if (!sfxEnabled || !audioCtx || isPaused) return;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    if (isPaused) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }, idx * 60);
            });
        }

        function createGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function renderGrid() {
            const cells = gridElement.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                cell.className = 'cell';
                if (grid[r][c] === 1) {
                    cell.classList.add('filled', gridColors[r][c]);
                }
            });
        }

        function getRandomPiece() {
            let pool = [...PIECES_EASY, ...PIECES_MEDIUM];
            if (score > 1000) pool = [...pool, ...PIECES_HARD];
            const piece = pool[Math.floor(Math.random() * pool.length)];
            return JSON.parse(JSON.stringify(piece));
        }

        function renderPieceHolder(holder, piece) {
            holder.innerHTML = '';
            if (!piece) return;

            const gridDiv = document.createElement('div');
            gridDiv.className = 'piece-grid';
            const rows = piece.shape.length;
            const cols = piece.shape[0].length;

            gridDiv.style.gridTemplateColumns = `repeat(${cols}, 14px)`;
            gridDiv.style.gridTemplateRows = `repeat(${rows}, 14px)`;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const block = document.createElement('div');
                    if (piece.shape[r][c]) {
                        block.className = `piece-block ${piece.color}`;
                    }
                    gridDiv.appendChild(block);
                }
            }
            holder.appendChild(gridDiv);
        }

        function generateNewPieces() {
            for (let i = 0; i < 3; i++) {
                currentPieces[i] = getRandomPiece();
            }
            renderAllHolders();
        }

        function renderAllHolders() {
            pieceHolders.forEach((holder, idx) => {
                renderPieceHolder(holder, currentPieces[idx]);
                if (currentPieces[idx]) {
                    holder.classList.remove('disabled');
                    holder.style.visibility = 'visible';
                } else {
                    holder.classList.add('disabled');
                }
            });
            renderPieceHolder(holdHolder, heldPiece);
            if (heldPiece) {
                holdHolder.style.visibility = 'visible';
            }
            checkGameOver();
        }

        function triggerArmAnim(animClass, duration = 400) {
            orangutanSvg.classList.remove('arms-move', 'arms-celebrate', 'arms-throw');
            void orangutanSvg.offsetWidth;
            orangutanSvg.classList.add(animClass);
            setTimeout(() => {
                orangutanSvg.classList.remove(animClass);
            }, duration);
        }

        function triggerBananaEffect() {
            triggerArmAnim('arms-throw', 600);
            
            const banana = document.createElement('div');
            banana.className = 'flying-banana';
            banana.textContent = '🍌';
            orangutanStage.appendChild(banana);

            setTimeout(() => {
                banana.remove();
            }, 1100);
        }

        function setupDragAndDrop() {
            const allHolders = [...pieceHolders, holdHolder];

            allHolders.forEach(holder => {
                holder.addEventListener('pointerdown', (e) => {
                    if (isPaused) return;
                    const type = holder.dataset.type;
                    const index = holder.dataset.index;

                    let piece = type === 'main' ? currentPieces[index] : heldPiece;
                    if (!piece) return;

                    initAudio();

                    let dragEl = holder.querySelector('.piece-grid').cloneNode(true);
                    dragEl.classList.add('dragging');
                    document.body.appendChild(dragEl);

                    const cols = piece.shape[0].length;
                    const rows = piece.shape.length;
                    
                    const cellSize = gridElement.clientWidth / 10;
                    dragEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
                    dragEl.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;

                    // Seçildiği an ilgili kutunun görseli hemen temizlensin
                    if (type === 'main') {
                        currentPieces[index] = null;
                        renderPieceHolder(holder, null);
                        holder.classList.add('disabled');
                    } else {
                        heldPiece = null;
                        renderPieceHolder(holdHolder, null);
                    }

                    activeDrag = {
                        holder,
                        type,
                        index: parseInt(index),
                        piece,
                        dragEl,
                        cols,
                        rows,
                        cellSize
                    };

                    updateDragPosition(e);
                });
            });

            window.addEventListener('pointermove', (e) => {
                if (!activeDrag) return;
                updateDragPosition(e);
                highlightPreview(e);
            });

            window.addEventListener('pointerup', (e) => {
                if (!activeDrag) return;
                
                clearPreview();
                const dropped = tryPlacePiece(e);

                if (!dropped) {
                    // Yerleştirilemediyse parçayı geri iade et
                    if (activeDrag.type === 'main') {
                        currentPieces[activeDrag.index] = activeDrag.piece;
                    } else {
                        heldPiece = activeDrag.piece;
                    }
                    renderAllHolders();
                }

                if (activeDrag.dragEl) {
                    activeDrag.dragEl.remove();
                }
                activeDrag = null;
            });
        }

        function updateDragPosition(e) {
            if (!activeDrag) return;
            const { dragEl, cols, rows, cellSize } = activeDrag;
            const width = cols * cellSize;
            const height = rows * cellSize;

            const x = e.clientX - width / 2;
            const y = e.clientY - height - 30;

            dragEl.style.left = `${x}px`;
            dragEl.style.top = `${y}px`;
        }

        function getBoardTargetCell(e) {
            const gridRect = gridElement.getBoundingClientRect();
            const { cols, rows, cellSize } = activeDrag;

            const width = cols * cellSize;
            const height = rows * cellSize;
            
            const pieceCenterX = e.clientX;
            const pieceCenterY = e.clientY - (height / 2) - 30;

            if (
                pieceCenterX < gridRect.left ||
                pieceCenterX > gridRect.right ||
                pieceCenterY < gridRect.top ||
                pieceCenterY > gridRect.bottom
            ) {
                return null;
            }

            const col = Math.floor((pieceCenterX - gridRect.left - (width / 2) + (cellSize / 2)) / cellSize);
            const row = Math.floor((pieceCenterY - gridRect.top - (height / 2) + (cellSize / 2)) / cellSize);

            return { row, col };
        }

        function canPlace(shape, startRow, startCol) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        const targetR = startRow + r;
                        const targetC = startCol + c;
                        if (
                            targetR < 0 || targetR >= BOARD_SIZE ||
                            targetC < 0 || targetC >= BOARD_SIZE ||
                            grid[targetR][targetC] === 1
                        ) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function highlightPreview(e) {
            clearPreview();

            const isOverHold = isPointerOverHold(e);
            if (isOverHold && activeDrag.type === 'main' && canHold) {
                holdHolder.style.background = 'rgba(56, 189, 248, 0.25)';
                return;
            } else {
                holdHolder.style.background = 'rgba(56, 189, 248, 0.05)';
            }

            const target = getBoardTargetCell(e);
            if (!target) return;

            const { row, col } = target;
            const { piece } = activeDrag;

            if (canPlace(piece.shape, row, col)) {
                for (let r = 0; r < piece.shape.length; r++) {
                    for (let c = 0; c < piece.shape[r].length; c++) {
                        if (piece.shape[r][c]) {
                            const cell = gridElement.querySelector(`.cell[data-row="${row + r}"][data-col="${col + c}"]`);
                            if (cell) cell.classList.add('preview', piece.color);
                        }
                    }
                }
            }
        }

        function clearPreview() {
            const cells = gridElement.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.remove('preview');
                ALL_COLORS.forEach(cls => {
                    if (!cell.classList.contains('filled')) {
                        cell.classList.remove(cls);
                    }
                });
            });
        }

        function isPointerOverHold(e) {
            const rect = holdHolder.getBoundingClientRect();
            return (
                e.clientX >= rect.left &&
                e.clientX <= rect.right &&
                e.clientY >= rect.top &&
                e.clientY <= rect.bottom
            );
        }

        function tryPlacePiece(e) {
            const { type, index, piece } = activeDrag;

            if (type === 'main' && canHold && isPointerOverHold(e)) {
                const temp = heldPiece;
                heldPiece = piece;
                currentPieces[index] = temp;
                canHold = false;
                renderAllHolders();
                return true;
            }

            const target = getBoardTargetCell(e);
            if (!target) return false;

            const { row, col } = target;

            if (canPlace(piece.shape, row, col)) {
                for (let r = 0; r < piece.shape.length; r++) {
                    for (let c = 0; c < piece.shape[r].length; c++) {
                        if (piece.shape[r][c]) {
                            grid[row + r][col + c] = 1;
                            gridColors[row + r][col + c] = piece.color;
                        }
                    }
                }

                playPlaceSound();
                triggerArmAnim('arms-move', 350);

                canHold = true;
                renderGrid();
                checkLines();

                if (currentPieces.every(p => p === null)) {
                    generateNewPieces();
                } else {
                    renderAllHolders();
                }

                return true;
            }

            return false;
        }

        function checkLines() {
            let fullRows = [];
            let fullCols = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) fullRows.push(r);
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] === 0) { full = false; break; }
                }
                if (full) fullCols.push(c);
            }

            const linesCleared = fullRows.length + fullCols.length;

            if (linesCleared > 0) {
                playExplosionSound();
                triggerArmAnim('arms-celebrate', 1200);

                let cellsToClear = new Set();

                fullRows.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) cellsToClear.add(`${r},${c}`);
                });
                fullCols.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) cellsToClear.add(`${r},${c}`);
                });

                cellsToClear.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    const cell = gridElement.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
                    if (cell) {
                        cell.classList.add('exploding-cell');
                        createSparks(cell);
                    }
                });

                setTimeout(() => {
                    cellsToClear.forEach(key => {
                        const [r, c] = key.split(',').map(Number);
                        grid[r][c] = 0;
                        gridColors[r][c] = null;
                    });
                    renderGrid();
                    checkGameOver();
                }, 250);

                let earnedScore = linesCleared * 100 * linesCleared;
                addScore(earnedScore);

                if (linesCleared > 1) {
                    comboElement.textContent = `COMBO x${linesCleared}!`;
                    comboElement.style.opacity = '1';
                    setTimeout(() => comboElement.style.opacity = '0', 1500);
                }
            }
        }

        function createSparks(cell) {
            const rect = cell.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 6; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.backgroundColor = window.getComputedStyle(cell).backgroundColor;
                spark.style.width = '6px';
                spark.style.height = '6px';
                spark.style.left = `${centerX}px`;
                spark.style.top = `${centerY}px`;

                const angle = Math.random() * Math.PI * 2;
                const dist = 20 + Math.random() * 30;
                spark.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                spark.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function addScore(pts) {
            score += pts;
            scoreElement.textContent = score;

            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('block_breaker_best', bestScore);
            }

            const newLevel = Math.floor(score / 1000) + 1;
            if (newLevel > currentLevel) {
                currentLevel = newLevel;
                levelElement.textContent = currentLevel;
                triggerLevelUpAnimation();
            }

            if (Math.floor(score / 100) > lastCoinThreshold) {
                const diff = Math.floor(score / 100) - lastCoinThreshold;
                coins += diff * 10;
                lastCoinThreshold = Math.floor(score / 100);
                updateCoinsDisplay();
            }

            if (Math.floor(score / 3000) > lastBananaThreshold) {
                lastBananaThreshold = Math.floor(score / 3000);
                triggerBananaEffect();
            }
        }

        function updateCoinsDisplay() {
            coinsElement.textContent = `🪙 ${coins}`;
            rerollBtn.disabled = coins < 500;
        }

        function triggerLevelUpAnimation() {
            playStarSparkleSound();
            levelOverlay.innerHTML = '';

            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.className = 'rising-star';
                star.textContent = ['⭐', '🌟', '✨', '🎉'][Math.floor(Math.random() * 4)];
                star.style.left = `${Math.random() * 90 + 5}%`;
                star.style.animationDelay = `${Math.random() * 0.6}s`;
                star.style.animationDuration = `${1.2 + Math.random() * 0.8}s`;
                levelOverlay.appendChild(star);
            }

            const text = document.createElement('div');
            text.className = 'level-up-text';
            text.textContent = `LEVEL ${currentLevel}!`;
            levelOverlay.appendChild(text);

            setTimeout(() => {
                levelOverlay.innerHTML = '';
            }, 2000);
        }

        rerollBtn.addEventListener('click', () => {
            if (coins >= 500) {
                coins -= 500;
                updateCoinsDisplay();
                generateNewPieces();
            }
        });

        function checkGameOver() {
            let availablePieces = currentPieces.filter(p => p !== null);
            if (heldPiece) availablePieces.push(heldPiece);

            if (availablePieces.length === 0) return;

            let canMove = false;

            for (let piece of availablePieces) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlace(piece.shape, r, c)) {
                            canMove = true;
                            break;
                        }
                    }
                    if (canMove) break;
                }
                if (canMove) break;
            }

            if (!canMove) {
                stopTimer();
                finalScoreElement.textContent = score;
                finalTimeElement.textContent = updateTimerDisplay();
                modalBestScoreElement.textContent = bestScore;
                gameOverModal.classList.add('active');
            }
        }

        function resetGame() {
            grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            score = 0;
            currentLevel = 1;
            totalSeconds = 0;
            lastCoinThreshold = 0;
            lastBananaThreshold = 0;
            scoreElement.textContent = 0;
            levelElement.textContent = 1;
            heldPiece = null;
            canHold = true;
            updateTimerDisplay();
            startTimer();
            renderGrid();
            generateNewPieces();
        }

        createGrid();
        resetGame();
        setupDragAndDrop();
    </script>
</body>
</html>
