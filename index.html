<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Breaker - Orman Macerası</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 15px;
            position: relative;
        }

        /* Üst Bilgi Paneli */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
        }

        .menu-btn {
            background: #059669;
            border: none;
            border-radius: 8px;
            color: white;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        /* Maymun ve Oyun Alanı */
        .board-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .orangutan-container {
            position: absolute;
            top: -45px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .orangutan-svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.2s ease;
        }

        .arms-move {
            animation: armMove 0.4s ease infinite alternate;
        }
        .arms-celebrate {
            animation: celebrateAnim 0.5s ease;
        }
        .arms-throw {
            animation: throwAnim 0.4s ease;
        }

        @keyframes armMove {
            0% { transform: rotate(-3deg) scale(1); }
            100% { transform: rotate(3deg) scale(1.05); }
        }
        @keyframes celebrateAnim {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.15) translateY(-10px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes throwAnim {
            0% { transform: scale(1); }
            50% { transform: scale(0.9) translateY(5px); }
            100% { transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            background: rgba(2, 44, 34, 0.8);
            padding: 8px;
            border-radius: 12px;
            border: 2px solid rgba(52, 211, 153, 0.3);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.3);
            width: 340px;
            height: 340px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            transition: background 0.1s ease, transform 0.1s ease;
        }

        .cell.filled {
            border-radius: 6px;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
        }

        .cell.preview {
            opacity: 0.6;
            transform: scale(0.95);
        }

        /* Renk Paleti */
        .color-1 { background: #e11d48 !important; }
        .color-2 { background: #2563eb !important; }
        .color-3 { background: #059669 !important; }
        .color-4 { background: #d97706 !important; }
        .color-5 { background: #7c3aed !important; }
        .color-6 { background: #db2777 !important; }
        .color-7 { background: #0891b2 !important; }
        .color-8 { background: #9333ea !important; }

        /* Alt Seçim Paneli ve Hold Alanı */
        .bottom-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 10px;
        }

        .tools-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .hold-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px dashed rgba(255,255,255,0.2);
            min-width: 80px;
            height: 50px;
            cursor: pointer;
        }

        .hold-container.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .hold-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .reroll-btn {
            background: #d97706;
            border: none;
            border-radius: 8px;
            color: white;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .reroll-btn:disabled {
            background: #475569;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .piece-holders {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 14px;
            height: 110px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .piece-holder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            cursor: grab;
            position: relative;
        }

        .piece-holder.disabled {
            cursor: not-allowed;
            opacity: 0.3;
        }

        .piece-holder:active {
            cursor: grabbing;
        }

        .piece-grid {
            display: grid;
            gap: 2px;
            pointer-events: none;
        }

        .piece-block {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* Sürükleme Efekti - Parmağın Üstünde ve Kaymasız */
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -140%) scale(1.15);
            opacity: 0.95;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
        }

        /* Efektler ve Animasyonlar */
        .spark {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 500;
            animation: sparkAnim 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes sparkAnim {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .flying-banana {
            position: fixed;
            font-size: 28px;
            pointer-events: none;
            z-index: 2000;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease;
        }

        .combo-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            transition: opacity 0.2s ease;
        }

        /* Modallar */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #064e3b;
            border: 2px solid #34d399;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: #34d399;
        }

        .modal-btn {
            background: #059669;
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #047857;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .setting-toggle {
            background: #dc2626;
            border: none;
            border-radius: 6px;
            color: white;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .setting-toggle.on {
            background: #059669;
        }

        .level-up-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 3100;
        }

        .level-up-text {
            font-size: 32px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            animation: popText 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .level-subtext {
            font-size: 18px;
            font-weight: bold;
            color: #34d399;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            margin-top: 5px;
        }

        @keyframes popText {
            0% { transform: scale(0.2); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Üst Bilgi Paneli -->
        <div class="header-panel">
            <div class="stat-box">
                <span class="stat-label">Skor</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">En İyi</span>
                <span class="stat-value" id="best-score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Süre</span>
                <span class="stat-value" id="timer">⏱️ 00:00</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Cüzdan</span>
                <span class="stat-value" id="coins">🪙 0</span>
            </div>
            <button class="menu-btn" id="menu-btn">⚙️</button>
        </div>

        <!-- Oyun Alanı -->
        <div class="board-area">
            <div class="combo-text" id="combo-text">COMBO x2!</div>
            <div class="orangutan-container">
                <svg class="orangutan-svg" id="orangutan-svg" viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="30" fill="#b45309"/>
                    <circle cx="30" cy="40" r="12" fill="#b45309"/>
                    <circle cx="70" cy="40" r="12" fill="#b45309"/>
                    <circle cx="30" cy="40" r="8" fill="#fde68a"/>
                    <circle cx="70" cy="40" r="8" fill="#fde68a"/>
                    <ellipse cx="50" cy="62" rx="18" ry="12" fill="#fde68a"/>
                    <circle cx="42" cy="58" r="3" fill="#1e293b"/>
                    <circle cx="58" cy="58" r="3" fill="#1e293b"/>
                    <path d="M 44 68 Q 50 74 56 68" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="grid" id="grid"></div>
        </div>

        <!-- Alt Panel -->
        <div class="bottom-panel">
            <div class="tools-bar">
                <div class="hold-container" id="hold-holder">
                    <span class="hold-label">Beklet</span>
                </div>
                <button class="reroll-btn" id="reroll-btn" disabled>🔄 Şekil Değiştir (500 🪙)</button>
            </div>
            <div class="piece-holders">
                <div class="piece-holder" data-index="0"></div>
                <div class="piece-holder" data-index="1"></div>
                <div class="piece-holder" data-index="2"></div>
            </div>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">Oyun Ayarları</div>
            <div class="setting-row">
                <span>Müzik (Ambient)</span>
                <button class="setting-toggle" id="toggle-music">KAPALI</button>
            </div>
            <div class="setting-row">
                <span>Ses Efektleri</span>
                <button class="setting-toggle" id="toggle-sfx">AÇIK</button>
            </div>
            <button class="modal-btn" id="close-menu-btn">Oyuna Dön</button>
            <button class="modal-btn" id="restart-game-btn" style="background: #dc2626;">Yeniden Başlat</button>
        </div>
    </div>

    <!-- Oyun Bitti Modalı -->
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <div class="modal-title" style="color: #ef4444;">Oyun Bitti!</div>
            <div style="font-size: 16px; color: #cbd5e1;">Skorun: <span id="final-score" style="font-weight:bold; color:#fff;">0</span></div>
            <div style="font-size: 14px; color: #cbd5e1;">Süre: <span id="final-time" style="font-weight:bold; color:#fff;">00:00</span></div>
            <div style="font-size: 14px; color: #cbd5e1;">En İyi Skor: <span id="modal-best-score" style="font-weight:bold; color:#facc15;">0</span></div>
            <button class="modal-btn" id="modal-restart-btn">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('block_breaker_best')) || 0;
        let coins = parseInt(localStorage.getItem('block_breaker_coins')) || 0;
        let totalSeconds = 0;
        let timerInterval = null;
        let isPaused = false;

        let currentPieces = [null, null, null];
        let heldPiece = null;
        let canHold = true;

        let lastCoinThreshold = 0;
        let lastBananaThreshold = 0;

        let musicEnabled = JSON.parse(localStorage.getItem('bb_music')) || false;
        let sfxEnabled = JSON.parse(localStorage.getItem('bb_sfx')) !== false;
        let audioCtx = null;

        const ALL_COLORS = ['color-1', 'color-2', 'color-3', 'color-4', 'color-5', 'color-6', 'color-7', 'color-8'];
        
        // Zorlaştırılmış Havuz: Küçük şekiller azaltıldı, büyük ve karmaşık bloklar ağırlık kazandı.
        const HARD_POOL = [
            { shape: [[1, 1, 1, 1]], color: 'color-2' },
            { shape: [[1], [1], [1], [1]], color: 'color-3' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'color-5' },
            { shape: [[1, 1, 0], [0, 1, 1]], color: 'color-6' },
            { shape: [[0, 1, 1], [1, 1, 0]], color: 'color-7' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'color-8' },
            { shape: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], color: 'color-1' },
            { shape: [[1, 1], [1, 1]], color: 'color-4' },
            { shape: [[1, 1, 1], [1, 1, 1]], color: 'color-2' },
            { shape: [[1, 1, 1, 1, 1]], color: 'color-3' }
        ];

        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const coinsElement = document.getElementById('coins');
        const timerElement = document.getElementById('timer');
        const pieceHolders = document.querySelectorAll('.piece-holder');
        const holdHolder = document.getElementById('hold-holder');
        const rerollBtn = document.getElementById('reroll-btn');
        const orangutanSvg = document.getElementById('orangutan-svg');
        const levelOverlay = document.querySelector('.board-area');

        const settingsModal = document.getElementById('settings-modal');
        const gameOverModal = document.getElementById('game-over-modal');
        const menuBtn = document.getElementById('menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const restartGameBtn = document.getElementById('restart-game-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const toggleMusicBtn = document.getElementById('toggle-music');
        const toggleSfxBtn = document.getElementById('toggle-sfx');

        const finalScoreElement = document.getElementById('final-score');
        const finalTimeElement = document.getElementById('final-time');
        const modalBestScoreElement = document.getElementById('modal-best-score');

        bestScoreElement.textContent = bestScore;
        coinsElement.textContent = `🪙 ${coins}`;
        syncSettingUI();

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            timerElement.textContent = `⏱️ ${mins}:${secs}`;
            return timerElement.textContent;
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function pauseGame() {
            isPaused = true;
            stopTimer();
            settingsModal.classList.add('active');
        }

        function resumeGame() {
            isPaused = false;
            startTimer();
            settingsModal.classList.remove('active');
        }

        function saveGameState() {
            const state = {
                grid,
                gridColors,
                score,
                coins,
                totalSeconds,
                currentPieces,
                heldPiece,
                canHold
            };
            localStorage.setItem('block_breaker_save', JSON.stringify(state));
            localStorage.setItem('block_breaker_coins', coins);
        }

        function loadGameState() {
            const saved = localStorage.getItem('block_breaker_save');
            if (!saved) return false;
            try {
                const state = JSON.parse(saved);
                grid = state.grid;
                gridColors = state.gridColors;
                score = state.score;
                coins = state.coins;
                totalSeconds = state.totalSeconds;
                currentPieces = state.currentPieces;
                heldPiece = state.heldPiece;
                canHold = state.canHold;

                scoreElement.textContent = score;
                coinsElement.textContent = `🪙 ${coins}`;
                updateTimerDisplay();
                initGrid();
                renderAllHolders();
                startTimer();
                return true;
            } catch (e) {
                return false;
            }
        }

        function clearSavedGame() {
            localStorage.removeItem('block_breaker_save');
        }

        function playSfx(type) {
            if (!audioCtx || !sfxEnabled || isPaused) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'drop') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'clear') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'game_over') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.6);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch(e) {}
        }

        function createSparkles(x, y, colorClass) {
            const colors = {
                'color-1': '#e11d48', 'color-2': '#2563eb', 'color-3': '#059669', 'color-4': '#d97706',
                'color-5': '#7c3aed', 'color-6': '#db2777', 'color-7': '#0891b2', 'color-8': '#9333ea'
            };
            const col = colors[colorClass] || '#38bdf8';
            for (let i = 0; i < 10; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.backgroundColor = col;
                spark.style.left = `${x}px`;
                spark.style.top = `${y}px`;
                const size = 6 + Math.random() * 4;
                spark.style.width = `${size}px`;
                spark.style.height = `${size}px`;
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 60;
                spark.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                spark.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function createFlyingBanana(startX, startY) {
            const banana = document.createElement('div');
            banana.className = 'flying-banana';
            banana.textContent = '🍌';
            banana.style.left = `${startX}px`;
            banana.style.top = `${startY}px`;
            document.body.appendChild(banana);

            const coinsRect = coinsElement.getBoundingClientRect();
            const targetX = coinsRect.left + coinsRect.width / 2;
            const targetY = coinsRect.top + coinsRect.height / 2;

            requestAnimationFrame(() => {
                banana.style.transform = `translate(${targetX - startX}px, ${targetY - startY}px) scale(0.4) rotate(360deg)`;
                banana.style.opacity = '0.3';
            });

            setTimeout(() => {
                banana.remove();
                coins += 50;
                updateCoinsDisplay();
                playSfx('coin');
                triggerOrangutanAction('throw');
                saveGameState();
            }, 600);
        }

        function triggerOrangutanAction(action) {
            orangutanSvg.classList.remove('arms-move', 'arms-celebrate', 'arms-throw');
            void orangutanSvg.offsetWidth;
            if (action === 'move') orangutanSvg.classList.add('arms-move');
            else if (action === 'celebrate') orangutanSvg.classList.add('arms-celebrate');
            else if (action === 'throw') orangutanSvg.classList.add('arms-throw');
        }

        function triggerLevelUpCelebration(title, subtitle) {
            playSfx('coin');
            triggerOrangutanAction('celebrate');
            const container = document.createElement('div');
            container.className = 'level-up-container';
            container.innerHTML = `<div class="level-up-text">${title}</div><div class="level-subtext">${subtitle}</div>`;
            levelOverlay.appendChild(container);
            setTimeout(() => container.remove(), 1800);
        }

        function updateCoinsDisplay() {
            coinsElement.textContent = `🪙 ${coins}`;
            updateRerollButtonState();
        }

        function updateRerollButtonState() {
            rerollBtn.disabled = coins < 500;
        }

        function syncSettingUI() {
            toggleMusicBtn.textContent = musicEnabled ? "AÇIK" : "KAPALI";
            if (musicEnabled) toggleMusicBtn.classList.add('on');
            else toggleMusicBtn.classList.remove('on');

            toggleSfxBtn.textContent = sfxEnabled ? "AÇIK" : "KAPALI";
            if (sfxEnabled) toggleSfxBtn.classList.add('on');
            else toggleSfxBtn.classList.remove('on');
        }

        function initGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    if (grid[r][c] === 1 && gridColors[r][c]) {
                        cell.classList.add('filled', gridColors[r][c]);
                    }
                    gridElement.appendChild(cell);
                }
            }
        }

        function renderGrid() {
            const cells = gridElement.children;
            let idx = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = cells[idx++];
                    cell.className = 'cell';
                    if (grid[r][c] === 1 && gridColors[r][c]) {
                        cell.classList.add('filled', gridColors[r][c]);
                    }
                }
            }
        }

        function getRandomPiece() {
            const template = HARD_POOL[Math.floor(Math.random() * HARD_POOL.length)];
            let color = template.color;
            if (Math.random() < 0.25) {
                color = ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)];
            }
            return { shape: template.shape, color: color };
        }

        function generateNewPieces() {
            for (let i = 0; i < 3; i++) {
                currentPieces[i] = getRandomPiece();
            }
            canHold = true;
            renderAllHolders();
            if (checkGameOverCondition()) triggerGameOver();
        }

        function renderPieceIntoHolder(holder, piece) {
            holder.innerHTML = '';
            if (!piece) return;
            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            const pieceGrid = document.createElement('div');
            pieceGrid.className = 'piece-grid';
            pieceGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            pieceGrid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const block = document.createElement('div');
                    block.className = 'piece-block';
                    if (piece.shape[r][c] === 1) {
                        block.classList.add(piece.color);
                    } else {
                        block.style.backgroundColor = 'transparent';
                    }
                    pieceGrid.appendChild(block);
                }
            }
            holder.appendChild(pieceGrid);
        }

        function renderAllHolders() {
            pieceHolders.forEach((holder, idx) => {
                renderPieceIntoHolder(holder, currentPieces[idx]);
                if (!currentPieces[idx]) holder.classList.add('disabled');
                else holder.classList.remove('disabled');
            });
            renderPieceIntoHolder(holdHolder, heldPiece);
            if (heldPiece && !canHold) holdHolder.classList.add('disabled');
            else holdHolder.classList.remove('disabled');
        }

        function checkGameOverCondition() {
            const activePieces = currentPieces.filter(p => p !== null);
            if (activePieces.length === 0) return false;

            for (let p of activePieces) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlacePiece(p, r, c)) return false;
                    }
                }
            }
            if (heldPiece) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlacePiece(heldPiece, r, c)) return false;
                    }
                }
            }
            return true;
        }

        function canPlacePiece(piece, startR, startC) {
            const shape = piece.shape;
            const rows = shape.length;
            const cols = shape[0].length;
            if (startR + rows > BOARD_SIZE || startC + cols > BOARD_SIZE) return false;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1 && grid[startR + r][startC + c] === 1) return false;
                }
            }
            return true;
        }

        function getCellFromTouch(clientX, clientY) {
            for (let cell of gridElement.children) {
                const rect = cell.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                    return { r: parseInt(cell.dataset.row), c: parseInt(cell.dataset.col) };
                }
            }
            return null;
        }

        function clearPreview() {
            for (let cell of gridElement.children) {
                cell.classList.remove('preview');
                ALL_COLORS.forEach(col => cell.classList.remove(col));
            }
        }

        function showPreview(piece, targetR, targetC) {
            clearPreview();
            if (!piece) return;
            const shape = piece.shape;
            const cells = gridElement.children;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c] === 1) {
                        const dr = targetR + r;
                        const dc = targetC + c;
                        if (dr >= 0 && dr < BOARD_SIZE && dc >= 0 && dc < BOARD_SIZE) {
                            cells[dr * BOARD_SIZE + dc].classList.add('preview', piece.color);
                        }
                    }
                }
            }
        }

        function placePieceOnGrid(piece, startR, startC) {
            const shape = piece.shape;
            let blocksPlaced = 0;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c] === 1) {
                        grid[startR + r][startC + c] = 1;
                        gridColors[startR + r][startC + c] = piece.color;
                        blocksPlaced++;
                    }
                }
            }
            score += blocksPlaced * 10;
            playSfx('drop');
            triggerOrangutanAction('move');
            checkLinesAndClear();
            updateScoreDisplay();
        }

        function checkLinesAndClear() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) rowsToClear.push(r);
            }
            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] === 0) { full = false; break; }
                }
                if (full) colsToClear.push(c);
            }

            const totalCleared = rowsToClear.length + colsToClear.length;
            if (totalCleared > 0) {
                playSfx('clear');
                triggerOrangutanAction('celebrate');

                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        grid[r][c] = 0;
                        gridColors[r][c] = null;
                        const rect = gridElement.children[r * BOARD_SIZE + c].getBoundingClientRect();
                        createSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 'color-4');
                    }
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        grid[r][c] = 0;
                        gridColors[r][c] = null;
                        const rect = gridElement.children[r * BOARD_SIZE + c].getBoundingClientRect();
                        createSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 'color-4');
                    }
                });

                score += totalCleared * 100;
                coins += totalCleared * 10;
                updateCoinsDisplay();
                checkMilestones();
            }
            renderGrid();
            updateScoreDisplay();
        }

        function checkMilestones() {
            if (score - lastCoinThreshold >= 500) {
                lastCoinThreshold += 500;
                coins += 100;
                updateCoinsDisplay();
                triggerLevelUpCelebration("BONUS COIN!", "+100 Coin Kazanıldı!");
            }
            if (score - lastBananaThreshold >= 1000) {
                lastBananaThreshold += 1000;
                createFlyingBanana(window.innerWidth / 2, window.innerHeight / 2);
                triggerLevelUpCelebration("MUZ YAĞMURU!", "Muzlar Toplanıyor!");
            }
        }

        function updateScoreDisplay() {
            scoreElement.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('block_breaker_best', bestScore);
            }
            saveGameState();
        }

        function triggerGameOver() {
            stopTimer();
            clearSavedGame();
            playSfx('game_over');
            finalScoreElement.textContent = score;
            finalTimeElement.textContent = updateTimerDisplay().replace('⏱️ ', '');
            modalBestScoreElement.textContent = bestScore;
            gameOverModal.classList.add('active');
        }

        function setupDragAndDrop(holder, isMain, indexOrHold) {
            let dragEl = null;

            holder.addEventListener('pointerdown', e => {
                if (isPaused) return;
                initAudio();
                const piece = isMain ? currentPieces[indexOrHold] : heldPiece;
                if (!piece) return;

                e.preventDefault();
                const rect = holder.getBoundingClientRect();

                dragEl = holder.cloneNode(true);
                dragEl.className = 'dragging';
                dragEl.style.left = `${rect.left}px`;
                dragEl.style.top = `${rect.top}px`;
                dragEl.style.width = `${rect.width}px`;
                dragEl.style.height = `${rect.height}px`;
                document.body.appendChild(dragEl);

                holder.style.opacity = '0.3';

                const onPointerMove = e => {
                    if (!dragEl) return;
                    // Sürüklenen şekil parmağın tam üstünde konumlanır
                    dragEl.style.left = `${e.clientX}px`;
                    dragEl.style.top = `${e.clientY}px`;

                    const cellCoord = getCellFromTouch(e.clientX, e.clientY);
                    if (cellCoord) {
                        const tr = cellCoord.r - Math.floor(piece.shape.length / 2);
                        const tc = cellCoord.c - Math.floor(piece.shape[0].length / 2);
                        if (canPlacePiece(piece, tr, tc)) showPreview(piece, tr, tc);
                        else clearPreview();
                    } else {
                        clearPreview();
                    }
                };

                const onPointerUp = e => {
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    clearPreview();

                    const cellCoord = getCellFromTouch(e.clientX, e.clientY);
                    let placed = false;
                    if (cellCoord) {
                        const tr = cellCoord.r - Math.floor(piece.shape.length / 2);
                        const tc = cellCoord.c - Math.floor(piece.shape[0].length / 2);
                        if (canPlacePiece(piece, tr, tc)) {
                            placePieceOnGrid(piece, tr, tc);
                            if (isMain) currentPieces[indexOrHold] = null;
                            else { heldPiece = null; canHold = false; }
                            placed = true;
                        }
                    }

                    if (dragEl) dragEl.remove();
                    holder.style.opacity = '1';
                    renderAllHolders();

                    if (placed) {
                        if (currentPieces.every(p => p === null)) generateNewPieces();
                        else if (checkGameOverCondition()) triggerGameOver();
                    }
                };

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            });
        }

        pieceHolders.forEach((holder, idx) => setupDragAndDrop(holder, true, idx));

        holdHolder.addEventListener('pointerdown', e => {
            if (!canHold || isPaused) return;
            initAudio();
            const firstIdx = currentPieces.findIndex(p => p !== null);
            if (firstIdx === -1) return;

            const temp = currentPieces[firstIdx];
            currentPieces[firstIdx] = heldPiece;
            heldPiece = temp;
            canHold = false;
            playSfx('drop');
            renderAllHolders();
            saveGameState();
            if (checkGameOverCondition()) triggerGameOver();
        });

        rerollBtn.addEventListener('click', () => {
            if (coins >= 500 && !isPaused) {
                coins -= 500;
                updateCoinsDisplay();
                generateNewPieces();
                playSfx('coin');
                triggerOrangutanAction('celebrate');
                saveGameState();
            }
        });

        menuBtn.addEventListener('click', pauseGame);
        closeMenuBtn.addEventListener('click', resumeGame);

        toggleMusicBtn.addEventListener('click', () => {
            musicEnabled = !musicEnabled;
            localStorage.setItem('bb_music', JSON.stringify(musicEnabled));
            syncSettingUI();
            initAudio();
        });

        toggleSfxBtn.addEventListener('click', () => {
            sfxEnabled = !sfxEnabled;
            localStorage.setItem('bb_sfx', JSON.stringify(sfxEnabled));
            syncSettingUI();
        });

        restartGameBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
            clearSavedGame();
            resetGameData();
        });

        modalRestartBtn.addEventListener('click', () => {
            gameOverModal.classList.remove('active');
            clearSavedGame();
            resetGameData();
        });

        function resetGameData() {
            grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            score = 0;
            totalSeconds = 0;
            lastCoinThreshold = 0;
            lastBananaThreshold = 0;
            isPaused = false;
            heldPiece = null;
            canHold = true;
            scoreElement.textContent = score;
            updateTimerDisplay();
            initGrid();
            generateNewPieces();
            startTimer();
        }

        function initApp() {
            initGrid();
            if (!loadGameState()) {
                generateNewPieces();
                startTimer();
            }
            updateRerollButtonState();
        }

        initApp();
    </script>
</body>
</html>
