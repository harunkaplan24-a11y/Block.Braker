<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Breaker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-container {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .coin-value {
            font-size: 24px;
            font-weight: bold;
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
        .combo-badge {
            font-size: 13px;
            font-weight: bold;
            color: #e11d48;
            height: 20px;
            transition: opacity 0.3s;
            opacity: 0;
            text-shadow: 0 0 8px rgba(225, 29, 72, 0.6);
        }
        .game-board-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 10px;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
        }
        .cell {
            background-color: #334155;
            border-radius: 4px;
            transition: background-color 0.05s ease, transform 0.05s ease;
            position: relative;
        }
        .cell.filled {
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.8), 0 0 12px currentColor;
        }
        .cell.preview {
            opacity: 0.6;
            transform: scale(0.95);
            box-shadow: inset 0 0 6px #fff;
        }
        .bottom-panel {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 10px 10px 15px 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pieces-container {
            width: 100%;
            height: 110px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .piece-holder {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .piece-grid {
            display: grid;
            gap: 2px;
        }
        .piece-block {
            border-radius: 3px;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.6);
        }
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.85;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
            will-change: transform, left, top;
        }

        /* Power-Up / Reroll Butonu */
        .reroll-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }
        .reroll-btn:active {
            transform: scale(0.95);
        }
        .reroll-btn:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Renk Paleti */
        .color-1 { background-color: #ef4444; color: #ef4444; }
        .color-2 { background-color: #3b82f6; color: #3b82f6; }
        .color-3 { background-color: #10b981; color: #10b981; }
        .color-4 { background-color: #f59e0b; color: #f59e0b; }
        .color-5 { background-color: #8b5cf6; color: #8b5cf6; }
        .color-6 { background-color: #ec4899; color: #ec4899; }
        .color-7 { background-color: #06b6d4; color: #06b6d4; }

        /* Efektler */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: sparkFly 0.5s ease-out forwards;
        }

        @keyframes sparkFly {
            0% { transform: translate(0, 0) scale(1.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        @keyframes cellFlash {
            0% { background-color: #ffffff; box-shadow: 0 0 25px #ffffff, 0 0 40px #f59e0b; }
            50% { background-color: #f59e0b; }
            100% { background-color: #334155; box-shadow: none; }
        }

        .exploding-cell {
            animation: cellFlash 0.35s ease-out forwards;
        }
    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <span class="score-label">Skor</span>
            <span id="score" class="score-value">0</span>
        </div>
        <div class="score-container" style="align-items: center;">
            <span class="score-label">Coin</span>
            <span id="coins" class="coin-value">🪙 0</span>
        </div>
        <div class="score-container" style="align-items: flex-end;">
            <span class="score-label">En Yüksek</span>
            <span id="best-score" class="score-value" style="color: #cbd5e1;">0</span>
        </div>
    </header>

    <div id="combo" class="combo-badge">COMBO x2!</div>

    <div class="game-board-wrapper">
        <div id="grid"></div>
    </div>

    <div class="bottom-panel">
        <div class="pieces-container" id="pieces-container">
            <div class="piece-holder" data-index="0"></div>
            <div class="piece-holder" data-index="1"></div>
            <div class="piece-holder" data-index="2"></div>
        </div>
        
        <button id="reroll-btn" class="reroll-btn">
            🔄 Şekil Değiştir (500 🪙)
        </button>
    </div>

    <script>
        const BOARD_SIZE = 10;
        let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let coins = parseInt(localStorage.getItem('block_breaker_coins')) || 0;
        let bestScore = parseInt(localStorage.getItem('block_breaker_best')) || 0;
        let lastCoinThreshold = 0;
        
        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const coinsElement = document.getElementById('coins');
        const bestScoreElement = document.getElementById('best-score');
        const comboElement = document.getElementById('combo');
        const rerollBtn = document.getElementById('reroll-btn');
        const pieceHolders = document.querySelectorAll('.piece-holder');

        bestScoreElement.textContent = bestScore;
        updateCoinsDisplay();

        const PIECES = [
            { shape: [[1]], color: 'color-1' },
            { shape: [[1, 1]], color: 'color-2' },
            { shape: [[1], [1]], color: 'color-2' },
            { shape: [[1, 1, 1]], color: 'color-3' },
            { shape: [[1], [1], [1]], color: 'color-3' },
            { shape: [[1, 1], [1, 1]], color: 'color-4' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'color-5' },
            { shape: [[1, 0], [1, 1]], color: 'color-6' },
            { shape: [[0, 1], [1, 1]], color: 'color-6' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'color-7' }
        ];

        let currentPieces = [null, null, null];
        let activeDrag = null;

        // Ses Sentezleyicisi
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playPlaceSound() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playExplosionSound() {
            initAudio();
            if (!audioCtx) return;

            const bufferSize = audioCtx.sampleRate * 0.35;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.35);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
            noise.stop(audioCtx.currentTime + 0.35);
        }

        function createBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function renderPiece(piece, container, cellSize = 20) {
            container.innerHTML = '';
            if (!piece) return;
            
            const grid = document.createElement('div');
            grid.classList.add('piece-grid');
            grid.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, ${cellSize}px)`;
            grid.style.gridTemplateRows = `repeat(${piece.shape.length}, ${cellSize}px)`;

            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    const block = document.createElement('div');
                    if (piece.shape[r][c]) {
                        block.classList.add('piece-block', piece.color);
                    }
                    grid.appendChild(block);
                }
            }
            container.appendChild(grid);
        }

        function spawnPieces() {
            for (let i = 0; i < 3; i++) {
                if (!currentPieces[i]) {
                    const randomPiece = PIECES[Math.floor(Math.random() * PIECES.length)];
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
            }
            checkGameOver();
        }

        rerollBtn.addEventListener('click', () => {
            initAudio();
            if (coins >= 500) {
                coins -= 500;
                localStorage.setItem('block_breaker_coins', coins);
                updateCoinsDisplay();

                for (let i = 0; i < 3; i++) {
                    const randomPiece = PIECES[Math.floor(Math.random() * PIECES.length)];
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
                checkGameOver();
            }
        });

        function updateCoinsDisplay() {
            coinsElement.textContent = `🪙 ${coins}`;
            rerollBtn.disabled = coins < 500;
        }

        function setupDragAndDrop() {
            pieceHolders.forEach(holder => {
                holder.addEventListener('pointerdown', onDragStart, { passive: false });
            });
        }

        function onDragStart(e) {
            initAudio();
            const index = parseInt(e.currentTarget.dataset.index);
            const piece = currentPieces[index];
            if (!piece) return;

            if (e.cancelable) e.preventDefault();

            const clone = document.createElement('div');
            clone.classList.add('dragging');
            
            const boardCell = document.querySelector('.cell');
            const cellSize = boardCell.getBoundingClientRect().width;
            renderPiece(piece, clone, cellSize);
            document.body.appendChild(clone);

            activeDrag = {
                index: index,
                piece: piece,
                element: clone,
                cellSize: cellSize
            };

            updateDragPosition(e.clientX, e.clientY);

            window.addEventListener('pointermove', onDragMove, { passive: false });
            window.addEventListener('pointerup', onDragEnd);
            window.addEventListener('pointercancel', onDragEnd);
        }

        function updateDragPosition(clientX, clientY) {
            if (!activeDrag) return;
            const piece = activeDrag.piece;
            const cellSize = activeDrag.cellSize;
            
            const pieceWidth = piece.shape[0].length * cellSize;
            const pieceHeight = piece.shape.length * cellSize;

            // Parmak tam parçanın üst-orta noktasında kalarak görüşü engellemez
            activeDrag.element.style.left = `${clientX - pieceWidth / 2}px`;
            activeDrag.element.style.top = `${clientY - pieceHeight / 2 - 20}px`;

            clearPreview();

            const targetPos = getTargetGridPosition(clientX, clientY);
            if (targetPos) {
                if (canPlace(piece, targetPos.r, targetPos.c)) {
                    drawPreview(piece, targetPos.r, targetPos.c);
                }
            }
        }

        function onDragMove(e) {
            if (e.cancelable) e.preventDefault();
            updateDragPosition(e.clientX, e.clientY);
        }

        // Hassas ve Hızlı Kare Algılama Mantığı
        function getTargetGridPosition(clientX, clientY) {
            const boardRect = gridElement.getBoundingClientRect();
            const cellSize = (boardRect.width - 16) / BOARD_SIZE; // Gap ve Padding hesabı

            // Parmak izinin biraz yukarısı hizalanır (daha rahat görünüm için)
            const adjustedY = clientY - 20;

            // Görsel olarak karelaj sınırı içinde mi? (1 kare esneklik payı eklendi)
            if (
                clientX >= boardRect.left - cellSize &&
                clientX <= boardRect.right + cellSize &&
                adjustedY >= boardRect.top - cellSize &&
                adjustedY <= boardRect.bottom + cellSize
            ) {
                const piece = activeDrag.piece;

                // Parmağın tahta üzerindeki bağıl konumu
                const relativeX = clientX - boardRect.left - 8;
                const relativeY = adjustedY - boardRect.top - 8;

                // Anında kareye yapışması için en yakın hücreye yuvarla
                let col = Math.round((relativeX - (piece.shape[0].length * cellSize) / 2) / cellSize);
                let row = Math.round((relativeY - (piece.shape.length * cellSize) / 2) / cellSize);

                return { r: row, c: col };
            }
            return null;
        }

        function onDragEnd(e) {
            if (!activeDrag) return;

            window.removeEventListener('pointermove', onDragMove);
            window.removeEventListener('pointerup', onDragEnd);
            window.removeEventListener('pointercancel', onDragEnd);

            const targetPos = getTargetGridPosition(e.clientX, e.clientY);
            let placed = false;

            if (targetPos) {
                if (canPlace(activeDrag.piece, targetPos.r, targetPos.c)) {
                    placePiece(activeDrag.piece, targetPos.r, targetPos.c);
                    currentPieces[activeDrag.index] = null;
                    pieceHolders[activeDrag.index].innerHTML = '';
                    placed = true;
                }
            }

            clearPreview();
            activeDrag.element.remove();
            activeDrag = null;

            if (placed) {
                playPlaceSound();
                checkLines();
                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    checkGameOver();
                }
            }
        }

        function canPlace(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        if (
                            targetR < 0 || targetR >= BOARD_SIZE ||
                            targetC < 0 || targetC >= BOARD_SIZE ||
                            grid[targetR][targetC]
                        ) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function drawPreview(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const cell = getCellElement(startR + r, startC + c);
                        if (cell) {
                            cell.classList.add('preview', piece.color);
                        }
                    }
                }
            }
        }

        function clearPreview() {
            document.querySelectorAll('.cell').forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (!grid[r][c]) {
                    if (!cell.classList.contains('exploding-cell')) {
                        cell.className = 'cell';
                    }
                } else {
                    cell.className = `cell filled ${gridColors[r][c]}`;
                }
            });
        }

        function placePiece(piece, startR, startC) {
            let addedScore = 0;
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        grid[targetR][targetC] = 1;
                        gridColors[targetR][targetC] = piece.color;
                        const cell = getCellElement(targetR, targetC);
                        cell.className = `cell filled ${piece.color}`;
                        addedScore += 10;
                    }
                }
            }
            updateScore(score + addedScore);
        }

        function getCellElement(r, c) {
            return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        }

        function createSparks(cell) {
            const rect = cell.getBoundingClientRect();
            const boardRect = gridElement.getBoundingClientRect();
            const centerX = rect.left - boardRect.left + rect.width / 2;
            const centerY = rect.top - boardRect.top + rect.height / 2;

            const sparkColors = ['#f59e0b', '#ef4444', '#38bdf8', '#ffffff', '#fbbf24'];

            for (let i = 0; i < 8; i++) {
                const spark = document.createElement('div');
                spark.classList.add('spark');
                
                const angle = (Math.PI * 2 / 8) * i + Math.random() * 0.5;
                const distance = 35 + Math.random() * 25;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                spark.style.left = `${centerX}px`;
                spark.style.top = `${centerY}px`;
                spark.style.backgroundColor = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                spark.style.boxShadow = `0 0 6px ${spark.style.backgroundColor}`;
                spark.style.setProperty('--tx', `${tx}px`);
                spark.style.setProperty('--ty', `${ty}px`);

                gridElement.appendChild(spark);

                setTimeout(() => spark.remove(), 500);
            }
        }

        function checkLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) {
                    rowsToClear.push(r);
                }
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] !== 1) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            const totalCleared = rowsToClear.length + colsToClear.length;
            if (totalCleared > 0) {
                playExplosionSound();
                let clearSet = new Set();

                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) clearSet.add(`${r},${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) clearSet.add(`${r},${c}`);
                });

                clearSet.forEach(coord => {
                    const [r, c] = coord.split(',').map(Number);
                    grid[r][c] = 0;
                    gridColors[r][c] = null;
                    const cell = getCellElement(r, c);
                    
                    cell.className = 'cell exploding-cell';
                    createSparks(cell);
                    
                    setTimeout(() => {
                        cell.className = 'cell';
                    }, 350);
                });

                let comboBonus = totalCleared * 100 * totalCleared;
                updateScore(score + comboBonus);

                if (totalCleared > 1) {
                    showCombo(totalCleared);
                }
            }
        }

        function showCombo(count) {
            comboElement.textContent = `COMBO x${count}!`;
            comboElement.style.opacity = '1';
            setTimeout(() => {
                comboElement.style.opacity = '0';
            }, 1200);
        }

        function updateScore(newScore) {
            score = newScore;
            scoreElement.textContent = score;

            const currentThreshold = Math.floor(score / 5000);
            if (currentThreshold > lastCoinThreshold) {
                const earnedCoins = (currentThreshold - lastCoinThreshold) * 1000;
                coins += earnedCoins;
                lastCoinThreshold = currentThreshold;
                localStorage.setItem('block_breaker_coins', coins);
                updateCoinsDisplay();
            }

            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('block_breaker_best', bestScore);
            }
        }

        function checkGameOver() {
            let canMove = false;
            for (let i = 0; i < 3; i++) {
                const piece = currentPieces[i];
                if (piece) {
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (canPlace(piece, r, c)) {
                                canMove = true;
                                break;
                            }
                        }
                        if (canMove) break;
                    }
                }
                if (canMove) break;
            }

            if (!canMove && currentPieces.some(p => p !== null)) {
                setTimeout(() => {
                    alert(`Oyun Bitti!\nToplam Skor: ${score}\nMevcut Coin: ${coins}`);
                    resetGame();
                }, 500);
            }
        }

        function resetGame() {
            grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            currentPieces = [null, null, null];
            lastCoinThreshold = 0;
            updateScore(0);
            createBoard();
            spawnPieces();
        }

        createBoard();
        spawnPieces();
        setupDragAndDrop();
    </script>
</body>
</html>
