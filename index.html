<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Breaker</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><rect x='15' y='15' width='32' height='32' rx='6' fill='%2338bdf8'/><rect x='53' y='15' width='32' height='32' rx='6' fill='%23f59e0b'/><rect x='15' y='53' width='32' height='32' rx='6' fill='%23ec4899'/></svg>">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        header {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-container {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-value {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }
        .level-value {
            font-size: 22px;
            font-weight: bold;
            color: #a855f7;
        }
        .coin-value {
            font-size: 22px;
            font-weight: bold;
            color: #f59e0b;
        }
        .top-controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: flex-end;
            padding: 0 10px;
        }
        .icon-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .icon-btn:active { background: #334155; }

        .combo-badge {
            font-size: 13px;
            font-weight: bold;
            color: #f43f5e;
            height: 20px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        /* YENİ GELİŞMİŞ MAYMUN KART TASARIMI VE ARM ANIMASYONU */
        .monkey-stage {
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .monkey-character {
            font-size: 44px;
            position: relative;
            display: inline-block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            animation: idleMonkey 1s infinite alternate ease-in-out;
        }

        .monkey-arm {
            position: absolute;
            right: -10px;
            top: 15px;
            font-size: 20px;
            transform-origin: left center;
            transition: transform 0.2s ease-out;
        }

        .monkey-character.throwing .monkey-arm {
            animation: throwArm 0.5s ease-in-out;
        }

        @keyframes idleMonkey {
            0% { transform: translateY(0) rotate(-4deg); }
            100% { transform: translateY(-6px) rotate(4deg); }
        }

        @keyframes throwArm {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-60deg) scale(1.3); }
            100% { transform: rotate(20deg) scale(1); }
        }

        /* UÇAN MUZ ANİMASYONU */
        .flying-banana {
            position: fixed;
            font-size: 28px;
            z-index: 2500;
            pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.2s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .game-board-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 10px;
            margin-top: 35px;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
        }
        .cell {
            background-color: #334155;
            border-radius: 4px;
            transition: background-color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
            position: relative;
        }

        .cell.filled { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
        .cell.preview { opacity: 0.5; transform: scale(0.95); }

        .bottom-panel {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 10px 10px 15px 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .pieces-area {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }
        .hold-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-right: 8px;
            border-right: 2px dashed #334155;
        }
        .hold-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .pieces-container {
            flex: 1;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .piece-holder {
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .piece-holder.hold-box {
            border: 2px dashed #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }
        .piece-holder.disabled { opacity: 0.4; pointer-events: none; }
        .piece-grid { display: grid; gap: 2px; }
        .piece-block { border-radius: 3px; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2); }
        
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.9;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
            will-change: transform, left, top;
        }

        .reroll-btn {
            background: #d97706;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }
        .reroll-btn:active { transform: scale(0.95); }
        .reroll-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .color-1 { background-color: #e11d48; color: #e11d48; }
        .color-2 { background-color: #2563eb; color: #2563eb; }
        .color-3 { background-color: #059669; color: #059669; }
        .color-4 { background-color: #d97706; color: #d97706; }
        .color-5 { background-color: #7c3aed; color: #7c3aed; }
        .color-6 { background-color: #db2777; color: #db2777; }
        .color-7 { background-color: #0891b2; color: #0891b2; }
        .color-8 { background-color: #9333ea; color: #9333ea; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 25px 20px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .setting-label {
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-btn {
            background: #334155;
            color: #94a3b8;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.on { background: #059669; color: #ffffff; }

        .menu-action-btn {
            background: #dc2626;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .menu-action-btn:active { transform: scale(0.96); }

        .close-btn {
            background: #334155;
            color: #cbd5e1;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* LEVEL UP & YILDIZ ANİMASYONU ALANI */
        .level-up-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rising-star {
            position: absolute;
            font-size: 28px;
            animation: riseUp 1.5s linear forwards;
            bottom: -50px;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .level-up-text {
            font-size: 48px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 20px #eab308, 0 0 40px #ca8a04;
            animation: textPop 1.8s ease-out forwards;
            letter-spacing: 2px;
        }

        .congrats-text {
            font-size: 52px;
            font-weight: 900;
            color: #ec4899;
            text-shadow: 0 0 20px #db2777, 0 0 40px #be185d;
            animation: blinkCongrats 0.3s infinite alternate, textPop 2.5s ease-out forwards;
            letter-spacing: 3px;
        }

        @keyframes blinkCongrats {
            0% { color: #f43f5e; text-shadow: 0 0 25px #f43f5e; }
            100% { color: #38bdf8; text-shadow: 0 0 25px #38bdf8; }
        }

        @keyframes textPop {
            0% { transform: scale(0.2); opacity: 0; }
            30% { transform: scale(1.2); opacity: 1; }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .spark {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: fireworkSpark 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes fireworkSpark {
            0% { transform: translate(0, 0) scale(1.2); opacity: 0.8; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .exploding-cell {
            transform: scale(0.85);
            opacity: 0.2;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
        }
    </style>
</head>
<body>

    <header>
        <div class="score-container">
            <span class="score-label">Skor</span>
            <span id="score" class="score-value">0</span>
        </div>
        <div class="score-container" style="align-items: center;">
            <span class="score-label">Level</span>
            <span id="level" class="level-value">1</span>
        </div>
        <div class="score-container" style="align-items: center;">
            <span class="score-label">Coin</span>
            <span id="coins" class="coin-value">🪙 0</span>
        </div>
        <div class="score-container" style="align-items: flex-end;">
            <span class="score-label">En Yüksek</span>
            <span id="best-score" class="score-value" style="color: #cbd5e1;">0</span>
        </div>
    </header>

    <div class="top-controls">
        <button id="menu-btn" class="icon-btn">⚙️ Menü</button>
    </div>

    <div id="combo" class="combo-badge">COMBO x2!</div>

    <div class="game-board-wrapper">
        <div class="monkey-stage">
            <div class="monkey-character" id="monkey">
                🐒
                <span class="monkey-arm" id="monkey-arm">🦾</span>
            </div>
        </div>
        <div id="grid"></div>
    </div>

    <div class="bottom-panel">
        <div class="pieces-area">
            <div class="hold-section">
                <span class="hold-title">📦 Yedek</span>
                <div class="piece-holder hold-box" id="hold-holder" data-type="hold"></div>
            </div>

            <div class="pieces-container" id="pieces-container">
                <div class="piece-holder" data-index="0" data-type="main"></div>
                <div class="piece-holder" data-index="1" data-type="main"></div>
                <div class="piece-holder" data-index="2" data-type="main"></div>
            </div>
        </div>
        
        <button id="reroll-btn" class="reroll-btn">
            🔄 Şekil Değiştir (500 🪙)
        </button>
    </div>

    <div id="level-overlay" class="level-up-container"></div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Ayarlar</h2>
            
            <div class="menu-setting-row">
                <span class="setting-label">🎵 Müzik</span>
                <button id="toggle-music" class="toggle-btn on">AÇIK</button>
            </div>

            <div class="menu-setting-row">
                <span class="setting-label">🔊 Ses Efektleri</span>
                <button id="toggle-sfx" class="toggle-btn on">AÇIK</button>
            </div>

            <button id="restart-game-btn" class="menu-action-btn">🔄 Oyunu Yeniden Başlat</button>
            <button id="close-menu-btn" class="close-btn">Devam Et</button>
        </div>
    </div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title" style="color: #ef4444;">Oyun Bitti</h2>
            <div style="background: #0f172a; border-radius: 12px; padding: 15px; margin: 15px 0;">
                <div style="font-size: 12px; color: #94a3b8; text-transform: uppercase;">Skorun</div>
                <div id="final-score" style="font-size: 36px; font-weight: bold; color: #38bdf8;">0</div>
            </div>
            <div style="font-size: 14px; color: #cbd5e1; margin-bottom: 20px;">
                En Yüksek Skor: <strong id="modal-best-score" style="color: #38bdf8;">0</strong>
            </div>
            <button id="modal-restart-btn" class="menu-action-btn" style="background: #0284c7;">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 10;
        let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        let gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let coins = 0;
        let currentLevel = 1;
        let bestScore = parseInt(localStorage.getItem('block_breaker_best')) || 0;
        let lastCoinThreshold = 0;
        let lastMonkeyBonusScore = 0;

        let musicEnabled = JSON.parse(localStorage.getItem('bb_music') ?? 'true');
        let sfxEnabled = JSON.parse(localStorage.getItem('bb_sfx') ?? 'true');

        const gridElement = document.getElementById('grid');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const coinsElement = document.getElementById('coins');
        const bestScoreElement = document.getElementById('best-score');
        const comboElement = document.getElementById('combo');
        const rerollBtn = document.getElementById('reroll-btn');
        const menuBtn = document.getElementById('menu-btn');
        const pieceHolders = document.querySelectorAll('.piece-holder[data-type="main"]');
        const holdHolder = document.getElementById('hold-holder');
        const levelOverlay = document.getElementById('level-overlay');
        const monkeyCharacter = document.getElementById('monkey');
        
        const settingsModal = document.getElementById('settings-modal');
        const toggleMusicBtn = document.getElementById('toggle-music');
        const toggleSfxBtn = document.getElementById('toggle-sfx');
        const restartGameBtn = document.getElementById('restart-game-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');

        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreElement = document.getElementById('final-score');
        const modalBestScoreElement = document.getElementById('modal-best-score');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        bestScoreElement.textContent = bestScore;
        updateCoinsDisplay();
        syncSettingUI();

        // ARTIRILMIŞ ZORLUK DÜZEYİNE GÖRE ŞEKİL VERİTABANI
        const PIECES_EASY = [
            { shape: [[1, 1]], color: 'color-2' },
            { shape: [[1], [1]], color: 'color-2' },
            { shape: [[1, 1, 1]], color: 'color-3' },
            { shape: [[1], [1], [1]], color: 'color-3' },
            { shape: [[1, 1], [1, 1]], color: 'color-4' },
            { shape: [[1, 0], [1, 1]], color: 'color-6' },
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'color-7' } // T Şekli başlangıca dahil edildi
        ];

        const PIECES_MEDIUM = [
            { shape: [[1, 1, 1, 1]], color: 'color-8' },
            { shape: [[1], [1], [1], [1]], color: 'color-8' },
            { shape: [[1, 1, 1], [1, 0, 0]], color: 'color-1' },
            { shape: [[1, 1, 1], [0, 0, 1]], color: 'color-5' },
            { shape: [[1, 1, 0], [0, 1, 1]], color: 'color-3' },
            { shape: [[1, 1, 1], [1, 1, 1]], color: 'color-4' }
        ];

        const PIECES_HARD = [
            { shape: [[1, 1, 1, 1, 1]], color: 'color-7' },
            { shape: [[1], [1], [1], [1], [1]], color: 'color-7' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'color-5' }, // 3x3 Büyük Blok
            { shape: [[1, 1, 1], [1, 0, 1]], color: 'color-8' },
            { shape: [[1, 1, 1], [1, 1, 0]], color: 'color-4' },
            { shape: [[0, 1, 1], [1, 1, 1]], color: 'color-6' }
        ];

        let currentPieces = [null, null, null];
        let heldPiece = null;
        let canHold = true;
        let activeDrag = null;

        let audioCtx = null;
        let ambientTimer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startAmbientMusic();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('pointerdown', initAudio, { once: false });

        function playTone(freq, duration = 2.5) {
            if (!audioCtx || !musicEnabled) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration);
        }

        function startAmbientMusic() {
            const notes = [261.63, 329.63, 392.00, 493.88, 523.25];
            let idx = 0;

            function nextNote() {
                if (musicEnabled && audioCtx && audioCtx.state === 'running') {
                    const freq = notes[idx % notes.length];
                    playTone(freq, 2.2);
                    if (idx % 3 === 0) playTone(freq * 1.25, 2.0);
                    idx++;
                }
                ambientTimer = setTimeout(nextNote, 2500);
            }
            nextNote();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pauseGameAndAudio();
        });

        window.addEventListener('blur', () => pauseGameAndAudio());

        function pauseGameAndAudio() {
            if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        }

        window.addEventListener('focus', () => {
            if (musicEnabled && audioCtx && audioCtx.state === 'suspended' && !settingsModal.classList.contains('active')) {
                audioCtx.resume();
            }
        });

        function syncSettingUI() {
            toggleMusicBtn.textContent = musicEnabled ? 'AÇIK' : 'KAPALI';
            toggleMusicBtn.className = `toggle-btn ${musicEnabled ? 'on' : ''}`;

            toggleSfxBtn.textContent = sfxEnabled ? 'AÇIK' : 'KAPALI';
            toggleSfxBtn.className = `toggle-btn ${sfxEnabled ? 'on' : ''}`;
        }

        menuBtn.addEventListener('click', () => {
            initAudio();
            settingsModal.classList.add('active');
        });

        closeMenuBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        });

        toggleMusicBtn.addEventListener('click', () => {
            musicEnabled = !musicEnabled;
            localStorage.setItem('bb_music', JSON.stringify(musicEnabled));
            syncSettingUI();
            if (!musicEnabled && audioCtx) audioCtx.suspend();
            if (musicEnabled && audioCtx) audioCtx.resume();
        });

        toggleSfxBtn.addEventListener('click', () => {
            sfxEnabled = !sfxEnabled;
            localStorage.setItem('bb_sfx', JSON.stringify(sfxEnabled));
            syncSettingUI();
        });

        restartGameBtn.addEventListener('click', () => {
            settingsModal.classList.remove('active');
            resetGame();
        });

        modalRestartBtn.addEventListener('click', () => {
            gameOverModal.classList.remove('active');
            resetGame();
        });

        function playPlaceSound() {
            if (!sfxEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.08);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playExplosionSound() {
            if (!sfxEnabled || !audioCtx) return;

            const duration = 0.25;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // FARKLI MUZ FIRLATMA VE ISLIK SESİ
        function playBananaThrowSound() {
            if (!sfxEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }

        function playStarSparkleSound() {
            if (!sfxEnabled || !audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }, idx * 70);
            });
        }

        function createBoard() {
            gridElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function getRandomPieceForLevel() {
            let pool = [...PIECES_EASY, ...PIECES_MEDIUM];
            if (currentLevel >= 2) pool = pool.concat(PIECES_HARD);

            const randomIndex = Math.floor(Math.random() * pool.length);
            return pool[randomIndex];
        }

        function renderPiece(piece, container, cellSize = 16) {
            container.innerHTML = '';
            if (!piece) return;
            
            const grid = document.createElement('div');
            grid.classList.add('piece-grid');
            grid.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, ${cellSize}px)`;
            grid.style.gridTemplateRows = `repeat(${piece.shape.length}, ${cellSize}px)`;

            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    const block = document.createElement('div');
                    if (piece.shape[r][c]) {
                        block.classList.add('piece-block', piece.color);
                    }
                    grid.appendChild(block);
                }
            }
            container.appendChild(grid);
        }

        function spawnPieces() {
            for (let i = 0; i < 3; i++) {
                if (!currentPieces[i]) {
                    const randomPiece = getRandomPieceForLevel();
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
            }
            canHold = true;
            updateHoldUI();
            saveGameState();
            checkGameOver();
        }

        function updateHoldUI() {
            renderPiece(heldPiece, holdHolder);
            if (!canHold) {
                holdHolder.classList.add('disabled');
            } else {
                holdHolder.classList.remove('disabled');
            }
        }

        rerollBtn.addEventListener('click', () => {
            initAudio();
            if (coins >= 500) {
                coins -= 500;
                updateCoinsDisplay();

                for (let i = 0; i < 3; i++) {
                    const randomPiece = getRandomPieceForLevel();
                    currentPieces[i] = randomPiece;
                    renderPiece(randomPiece, pieceHolders[i]);
                }
                saveGameState();
                checkGameOver();
            }
        });

        function updateCoinsDisplay() {
            coinsElement.textContent = `🪙 ${coins}`;
            rerollBtn.disabled = coins < 500;
        }

        function setupDragAndDrop() {
            document.querySelectorAll('.piece-holder').forEach(holder => {
                holder.addEventListener('pointerdown', onDragStart, { passive: false });
            });
        }

        function onDragStart(e) {
            initAudio();
            const holder = e.currentTarget;
            const isHoldType = holder.dataset.type === 'hold';
            let piece = null;
            let index = -1;

            if (isHoldType) {
                if (!heldPiece || !canHold) return;
                piece = heldPiece;
            } else {
                index = parseInt(holder.dataset.index);
                piece = currentPieces[index];
            }

            if (!piece) return;

            if (e.cancelable) e.preventDefault();

            holder.innerHTML = '';

            const clone = document.createElement('div');
            clone.classList.add('dragging');
            
            const boardCell = document.querySelector('.cell');
            const cellSize = boardCell.getBoundingClientRect().width;
            renderPiece(piece, clone, cellSize);
            document.body.appendChild(clone);

            activeDrag = {
                index: index,
                isHold: isHoldType,
                piece: piece,
                element: clone,
                cellSize: cellSize,
                holderElement: holder
            };

            updateDragPosition(e.clientX, e.clientY);

            window.addEventListener('pointermove', onDragMove, { passive: false });
            window.addEventListener('pointerup', onDragEnd);
            window.addEventListener('pointercancel', onDragEnd);
        }

        function updateDragPosition(clientX, clientY) {
            if (!activeDrag) return;
            const piece = activeDrag.piece;
            const cellSize = activeDrag.cellSize;
            
            const pieceWidth = piece.shape[0].length * cellSize;

            activeDrag.element.style.left = `${clientX - pieceWidth / 2}px`;
            activeDrag.element.style.top = `${clientY - (piece.shape.length * cellSize) / 2 - 25}px`;

            clearPreview();

            const holdRect = holdHolder.getBoundingClientRect();
            if (
                clientX >= holdRect.left && clientX <= holdRect.right &&
                clientY >= holdRect.top && clientY <= holdRect.bottom
            ) {
                if (!activeDrag.isHold && canHold) {
                    holdHolder.style.backgroundColor = 'rgba(56, 189, 248, 0.2)';
                }
                return;
            } else {
                holdHolder.style.backgroundColor = '';
            }

            const targetPos = getTargetGridPosition(clientX, clientY);
            if (targetPos) {
                if (canPlace(piece, targetPos.r, targetPos.c)) {
                    drawPreview(piece, targetPos.r, targetPos.c);
                }
            }
        }

        function onDragMove(e) {
            if (e.cancelable) e.preventDefault();
            updateDragPosition(e.clientX, e.clientY);
        }

        function getTargetGridPosition(clientX, clientY) {
            const boardRect = gridElement.getBoundingClientRect();
            const cellSize = (boardRect.width - 16) / BOARD_SIZE;
            const adjustedY = clientY - 25;

            if (
                clientX >= boardRect.left - cellSize &&
                clientX <= boardRect.right + cellSize &&
                adjustedY >= boardRect.top - cellSize &&
                adjustedY <= boardRect.bottom + cellSize
            ) {
                const piece = activeDrag.piece;
                const relativeX = clientX - boardRect.left - 8;
                const relativeY = adjustedY - boardRect.top - 8;

                let col = Math.round((relativeX - (piece.shape[0].length * cellSize) / 2) / cellSize);
                let row = Math.round((relativeY - (piece.shape.length * cellSize) / 2) / cellSize);

                return { r: row, c: col };
            }
            return null;
        }

        function onDragEnd(e) {
            if (!activeDrag) return;

            window.removeEventListener('pointermove', onDragMove);
            window.removeEventListener('pointerup', onDragEnd);
            window.removeEventListener('pointercancel', onDragEnd);

            holdHolder.style.backgroundColor = '';

            const holdRect = holdHolder.getBoundingClientRect();
            let droppedInHold = (
                e.clientX >= holdRect.left && e.clientX <= holdRect.right &&
                e.clientY >= holdRect.top && e.clientY <= holdRect.bottom
            );

            if (droppedInHold && !activeDrag.isHold && canHold) {
                const temp = heldPiece;
                heldPiece = activeDrag.piece;
                currentPieces[activeDrag.index] = temp;

                if (temp) {
                    renderPiece(temp, pieceHolders[activeDrag.index]);
                } else {
                    pieceHolders[activeDrag.index].innerHTML = '';
                }

                canHold = false;
                updateHoldUI();
                clearPreview();
                activeDrag.element.remove();
                activeDrag = null;

                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    saveGameState();
                    checkGameOver();
                }
                return;
            }

            const targetPos = getTargetGridPosition(e.clientX, e.clientY);
            let placed = false;

            if (targetPos && canPlace(activeDrag.piece, targetPos.r, targetPos.c)) {
                placePiece(activeDrag.piece, targetPos.r, targetPos.c);
                
                if (activeDrag.isHold) {
                    heldPiece = null;
                    canHold = false;
                    updateHoldUI();
                } else {
                    currentPieces[activeDrag.index] = null;
                    pieceHolders[activeDrag.index].innerHTML = '';
                }
                placed = true;
            } else {
                renderPiece(activeDrag.piece, activeDrag.holderElement);
            }

            clearPreview();
            activeDrag.element.remove();
            activeDrag = null;

            if (placed) {
                playPlaceSound();
                checkLines();
                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    saveGameState();
                    checkGameOver();
                }
            }
        }

        function canPlace(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        if (
                            targetR < 0 || targetR >= BOARD_SIZE ||
                            targetC < 0 || targetC >= BOARD_SIZE ||
                            grid[targetR][targetC]
                        ) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function drawPreview(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const cell = getCellElement(startR + r, startC + c);
                        if (cell) {
                            cell.classList.add('preview', piece.color);
                        }
                    }
                }
            }
        }

        function clearPreview() {
            document.querySelectorAll('.cell').forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (!grid[r][c]) {
                    if (!cell.classList.contains('exploding-cell')) {
                        cell.className = 'cell';
                    }
                } else {
                    cell.className = `cell filled ${gridColors[r][c]}`;
                }
            });
        }

        // DEĞİŞİKLİK: ŞEKİL YERLEŞTİRİNCE PUAN VERİLMEZ (PUAN YALNIZCA PATLATILDIĞINDA GELİR)
        function placePiece(piece, startR, startC) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[0].length; c++) {
                    if (piece.shape[r][c]) {
                        const targetR = startR + r;
                        const targetC = startC + c;
                        grid[targetR][targetC] = 1;
                        gridColors[targetR][targetC] = piece.color;
                        const cell = getCellElement(targetR, targetC);
                        cell.className = `cell filled ${piece.color}`;
                    }
                }
            }
        }

        function getCellElement(r, c) {
            return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        }

        function createFireworks(cell) {
            const rect = cell.getBoundingClientRect();
            const boardRect = gridElement.getBoundingClientRect();
            const centerX = rect.left - boardRect.left + rect.width / 2;
            const centerY = rect.top - boardRect.top + rect.height / 2;

            const fireworkColors = ['#d97706', '#0891b2', '#db2777', '#059669', '#ffffff'];

            const sparkCount = 8;
            for (let i = 0; i < sparkCount; i++) {
                const spark = document.createElement('div');
                spark.classList.add('spark');
                
                const angle = (Math.PI * 2 / sparkCount) * i;
                const distance = 20 + Math.random() * 15;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                const sparkSize = Math.floor(Math.random() * 3) + 3;
                spark.style.width = `${sparkSize}px`;
                spark.style.height = `${sparkSize}px`;

                spark.style.left = `${centerX}px`;
                spark.style.top = `${centerY}px`;
                
                const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                spark.style.backgroundColor = color;
                spark.style.setProperty('--tx', `${tx}px`);
                spark.style.setProperty('--ty', `${ty}px`);

                gridElement.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        function checkLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) {
                    rowsToClear.push(r);
                }
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] !== 1) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            const totalCleared = rowsToClear.length + colsToClear.length;
            if (totalCleared > 0) {
                playExplosionSound();

                let clearSet = new Set();
                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) clearSet.add(`${r},${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) clearSet.add(`${r},${c}`);
                });

                clearSet.forEach(coord => {
                    const [r, c] = coord.split(',').map(Number);
                    grid[r][c] = 0;
                    gridColors[r][c] = null;
                    const cell = getCellElement(r, c);
                    
                    cell.className = 'cell exploding-cell';
                    createFireworks(cell);
                    
                    setTimeout(() => {
                        cell.className = 'cell';
                    }, 250);
                });

                // YALNIZCA PATLATILAN ÇİZGİLERDEN PUAN KAZANILIR
                let pointsGained = clearSet.size * 15 + (totalCleared * 100);
                updateScore(score + pointsGained);

                if (totalCleared > 1) {
                    showCombo(totalCleared);
                }
            }
        }

        function showCombo(count) {
            comboElement.textContent = `COMBO x${count}!`;
            comboElement.style.opacity = '1';
            setTimeout(() => {
                comboElement.style.opacity = '0';
            }, 1200);
        }

        // MAYMUN MUZ ATMA VE PATLATMA EFEKTİ (ANIMASYONLU & SESLİ)
        function triggerMonkeyBonus() {
            monkeyCharacter.classList.add('throwing');
            playBananaThrowSound();

            let allCoords = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    allCoords.push({ r, c });
                }
            }
            allCoords.sort(() => Math.random() - 0.5);
            let targets = allCoords.slice(0, 6);

            const monkeyRect = monkeyCharacter.getBoundingClientRect();

            targets.forEach((target, i) => {
                setTimeout(() => {
                    const flyingBanana = document.createElement('div');
                    flyingBanana.classList.add('flying-banana');
                    flyingBanana.textContent = '🍌';

                    const startX = monkeyRect.left + monkeyRect.width / 2;
                    const startY = monkeyRect.top + monkeyRect.height / 2;

                    flyingBanana.style.left = `${startX}px`;
                    flyingBanana.style.top = `${startY}px`;

                    document.body.appendChild(flyingBanana);

                    const targetCell = getCellElement(target.r, target.c);
                    const cellRect = targetCell.getBoundingClientRect();
                    const destX = cellRect.left + cellRect.width / 2 - 14;
                    const destY = cellRect.top + cellRect.height / 2 - 14;

                    requestAnimationFrame(() => {
                        flyingBanana.style.transform = `translate(${destX - startX}px, ${destY - startY}px) rotate(720deg) scale(1.2)`;
                    });

                    setTimeout(() => {
                        flyingBanana.style.opacity = '0';
                        setTimeout(() => flyingBanana.remove(), 200);

                        grid[target.r][target.c] = 0;
                        gridColors[target.r][target.c] = null;
                        targetCell.className = 'cell exploding-cell';
                        createFireworks(targetCell);
                        playExplosionSound();

                        setTimeout(() => {
                            targetCell.className = 'cell';
                        }, 300);

                    }, 800);
                }, i * 200);
            });

            setTimeout(() => {
                monkeyCharacter.classList.remove('throwing');
            }, 1500);

            updateScore(score + 400); // Bonus Puanı
        }

        // LEVEL ATLAMA & YILDIZ ANİMASYONU
        function triggerLevelUpEffect(newLevel) {
            playStarSparkleSound();

            for (let i = 0; i < 25; i++) {
                const star = document.createElement('div');
                star.classList.add('rising-star');
                star.textContent = ['⭐', '🌟', '✨', '💫'][Math.floor(Math.random() * 4)];
                star.style.left = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 0.8}s`;
                levelOverlay.appendChild(star);
                setTimeout(() => star.remove(), 2200);
            }

            const textEl = document.createElement('div');
            if (newLevel === 10) {
                textEl.classList.add('congrats-text');
                textEl.textContent = '🎉 TEBRİKLER! 🎉';
            } else {
                textEl.classList.add('level-up-text');
                textEl.textContent = `LEVEL ${newLevel}`;
            }

            levelOverlay.appendChild(textEl);
            setTimeout(() => textEl.remove(), 2200);
        }

        function updateScore(newScore) {
            score = newScore;
            scoreElement.textContent = score;

            // 5000 Puanda Bir Level Atlama
            const calculatedLevel = Math.floor(score / 5000) + 1;
            if (calculatedLevel > currentLevel) {
                currentLevel = calculatedLevel;
                levelElement.textContent = currentLevel;
                triggerLevelUpEffect(currentLevel);
            }

            // 5000 Puanda Bir Coin Kazanma
            const currentCoinThreshold = Math.floor(score / 5000);
            if (currentCoinThreshold > lastCoinThreshold) {
                const earnedCoins = (currentCoinThreshold - lastCoinThreshold) * 1000;
                coins += earnedCoins;
                lastCoinThreshold = currentCoinThreshold;
                updateCoinsDisplay();
            }

            // 3000 Puanda Bir Maymun Bonusu (Muz Fırlatma)
            const currentMonkeyThreshold = Math.floor(score / 3000);
            if (currentMonkeyThreshold > lastMonkeyBonusScore) {
                lastMonkeyBonusScore = currentMonkeyThreshold;
                triggerMonkeyBonus();
            }

            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.textContent = bestScore;
                localStorage.setItem('block_breaker_best', bestScore);
            }
        }

        function checkGameOver() {
            let canMove = false;
            const allAvailablePieces = [...currentPieces, heldPiece].filter(p => p !== null);

            for (let piece of allAvailablePieces) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlace(piece, r, c)) {
                            canMove = true;
                            break;
                        }
                    }
                    if (canMove) break;
                }
                if (canMove) break;
            }

            if (!canMove && allAvailablePieces.length > 0) {
                setTimeout(() => {
                    finalScoreElement.textContent = score;
                    modalBestScoreElement.textContent = bestScore;
                    gameOverModal.classList.add('active');
                }, 400);
            }
        }

        function saveGameState() {
            const state = {
                grid: grid,
                gridColors: gridColors,
                score: score,
                coins: coins,
                currentLevel: currentLevel,
                currentPieces: currentPieces,
                heldPiece: heldPiece,
                canHold: canHold,
                lastCoinThreshold: lastCoinThreshold,
                lastMonkeyBonusScore: lastMonkeyBonusScore
            };
            localStorage.setItem('block_breaker_saved_state', JSON.stringify(state));
        }

        function loadGameState() {
            const saved = localStorage.getItem('block_breaker_saved_state');
            if (saved) {
                try {
                    const state = JSON.parse(saved);
                    grid = state.grid;
                    gridColors = state.gridColors;
                    score = state.score;
                    coins = state.coins || 0;
                    currentLevel = state.currentLevel || 1;
                    currentPieces = state.currentPieces;
                    heldPiece = state.heldPiece || null;
                    canHold = state.canHold ?? true;
                    lastCoinThreshold = state.lastCoinThreshold || 0;
                    lastMonkeyBonusScore = state.lastMonkeyBonusScore || 0;

                    scoreElement.textContent = score;
                    levelElement.textContent = currentLevel;
                    updateCoinsDisplay();

                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (grid[r][c]) {
                                const cell = getCellElement(r, c);
                                cell.className = `cell filled ${gridColors[r][c]}`;
                            }
                        }
                    }

                    for (let i = 0; i < 3; i++) {
                        if (currentPieces[i]) {
                            renderPiece(currentPieces[i], pieceHolders[i]);
                        }
                    }

                    updateHoldUI();
                    return true;
                } catch(e) {
                    return false;
                }
            }
            return false;
        }

        function resetGame() {
            grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gridColors = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            currentPieces = [null, null, null];
            heldPiece = null;
            canHold = true;
            coins = 0;
            currentLevel = 1;
            lastCoinThreshold = 0;
            lastMonkeyBonusScore = 0;

            levelElement.textContent = currentLevel;
            updateCoinsDisplay();
            updateScore(0);
            createBoard();
            updateHoldUI();
            spawnPieces();
            saveGameState();

            // İLK BAŞLANGIÇ LEVEL 1 YILDIZ ANİMASYONU
            triggerLevelUpEffect(1);
        }

        createBoard();
        setupDragAndDrop();

        if (!loadGameState()) {
            spawnPieces();
            triggerLevelUpEffect(1);
        }
    </script>
</body>
</html>
