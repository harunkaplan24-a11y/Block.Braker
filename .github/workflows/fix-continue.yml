name: Fix continue resume
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continue behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="resumeGameBtn.addEventListener('click',()=>{if(coins<2000)return;gameOverModal.classList.remove('active');coins-=2000;updateCoinsDisplay();isPaused=false;startTimer();saveGameState();triggerArmAnim('arms-throw',700);for(let i=0;i<20;i++)setTimeout(()=>{triggerArmAnim('arms-throw',700);throwResumeBanana();},i*120);});"
          new="resumeGameBtn.addEventListener('click',()=>{if(coins<2000)return;suppressGameOverCheck=true;gameOverModal.classList.remove('active');if(!loadGameState()){suppressGameOverCheck=false;return}coins-=2000;updateCoinsDisplay();isPaused=false;saveGameState();startTimer();triggerArmAnim('arms-throw',700);let resumeBananasLeft=20;for(let i=0;i<20;i++)setTimeout(()=>{if(resumeBananasLeft<=0)return;resumeBananasLeft--;triggerBananaEffect(1);if(resumeBananasLeft===0)setTimeout(()=>{suppressGameOverCheck=false;saveGameState();},500);},i*220);});"
          if old not in s:
              raise SystemExit('resume handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          rm -f .github/workflows/fix-continue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-continue.yml
          git commit -m 'Fix continue to resume and destroy blocks with 20 bananas'
          git push
