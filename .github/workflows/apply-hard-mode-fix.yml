name: Apply game fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply resume game changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Kaldığın Yerden Devam Et — 10.000 🪙','Kaldığın Yerden Devam Et — 2.000 🪙')
          text = text.replace('coins<10000','coins<2000')
          text = text.replace('coins-=10000','coins-=2000')
          old = "resumeGameBtn.addEventListener('click',()=>{if(coins<2000)return;gameOverModal.classList.remove('active');if(!loadGameState())return;coins-=2000;updateCoinsDisplay();isPaused=false;startTimer();saveGameState();triggerArmAnim('arms-throw',700);setTimeout(()=>triggerBananaEffect(),350);setTimeout(()=>triggerBananaEffect(),2850);});"
          new = "resumeGameBtn.addEventListener('click',()=>{if(coins<2000)return;gameOverModal.classList.remove('active');if(!loadGameState())return;coins-=2000;updateCoinsDisplay();isPaused=false;startTimer();saveGameState();triggerArmAnim('arms-throw',700);for(let i=0;i<20;i++)setTimeout(()=>triggerBananaEffect(),350+i*180);});"
          if old in text:
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes to commit"; else git commit -m "fix: make resume 2000 coins and throw 20 bananas"; git push; fi
