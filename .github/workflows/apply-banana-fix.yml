name: Apply banana animation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch banana animation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('transition:transform 1.35s cubic-bezier(.22,.61,.36,1),opacity .3s ease-in','transition:transform 1.8s cubic-bezier(.22,.61,.36,1),opacity .3s ease-in')
          new='''function triggerBananaEffect(){\nlet cells=[];for(let r=0;r<BOARD_SIZE;r++)for(let c=0;c<BOARD_SIZE;c++)if(grid[r][c]===1)cells.push({r,c});\nif(cells.length<6)return;\nfor(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}\nconst sel=cells.slice(0,6);\nconst o=orangutanSvg.getBoundingClientRect(),sx=o.left+o.width/2,sy=o.top+o.height/2;\nsel.forEach((t,i)=>setTimeout(()=>{\ntriggerArmAnim('arms-throw',800);\nconst cell=gridElement.querySelector(`.cell[data-row="${t.r}"][data-col="${t.c}"]`);if(!cell||grid[t.r][t.c]!==1)return;\nconst q=cell.getBoundingClientRect(),tx=q.left+q.width/2,ty=q.top+q.height/2,b=document.createElement('div');\nb.className='flying-banana';b.textContent='🍌';b.style.left=`${sx-22}px`;b.style.top=`${sy-22}px`;document.body.appendChild(b);\nrequestAnimationFrame(()=>{b.style.transform=`translate(${tx-sx+22}px,${ty-sy+22}px) scale(1.25) rotate(360deg)`});\nsetTimeout(()=>{b.remove();if(grid[t.r][t.c]===1){grid[t.r][t.c]=0;gridColors[t.r][t.c]=null;cell.classList.remove('filled',...ALL_COLORS);cell.classList.remove('exploding-cell');createSparks(cell);playExplosionSound();addScore(50)}},1800);\n},i*650));\n}'''
          s=re.sub(r"function triggerBananaEffect\(\)\{.*?\n\}\nfunction setupDragAndDrop",new+'\nfunction setupDragAndDrop',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-banana-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-banana-fix.yml
          git diff --cached --quiet || git commit -m 'Fix banana count and slow throw animation'
          git push