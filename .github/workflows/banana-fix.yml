name: Banana Fix
on: push
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch banana effect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function triggerBananaEffect()')
          end=s.index('function setupDragAndDrop()')
          new='''function triggerBananaEffect(){\n  const cells=[];\n  for(let r=0;r<BOARD_SIZE;r++) for(let c=0;c<BOARD_SIZE;c++){\n    if(grid[r][c]===1) cells.push({r,c});\n  }\n  if(!cells.length)return;\n  const targets=[];\n  while(cells.length&&targets.length<6){\n    const i=Math.floor(Math.random()*cells.length);\n    targets.push(cells.splice(i,1)[0]);\n  }\n  const o=orangutanSvg.getBoundingClientRect();\n  const sx=o.left+o.width*0.82,sy=o.top+o.height*0.30;\n  targets.forEach((t,i)=>{\n    setTimeout(()=>{\n      if(grid[t.r]?.[t.c]!==1)return;\n      triggerArmAnim('arms-throw',700);\n      const cell=gridElement.querySelector(`.cell[data-row="${t.r}"][data-col="${t.c}"]`);\n      if(!cell)return;\n      const q=cell.getBoundingClientRect(),tx=q.left+q.width/2,ty=q.top+q.height/2;\n      const b=document.createElement('div');\n      b.className='flying-banana';\n      b.textContent='🍌';\n      b.style.left=`${sx-22}px`;\n      b.style.top=`${sy-22}px`;\n      b.style.transform='translate(0,0) scale(.8) rotate(-20deg)';\n      b.style.transition='transform 2600ms cubic-bezier(.2,.75,.25,1), opacity 180ms ease-out';\n      document.body.appendChild(b);\n      requestAnimationFrame(()=>requestAnimationFrame(()=>{\n        b.style.transform=`translate(${tx-sx}px,${ty-sy}px) scale(1.15) rotate(720deg)`;\n      }));\n      setTimeout(()=>{\n        b.style.opacity='0';\n        if(grid[t.r]?.[t.c]===1){\n          grid[t.r][t.c]=0;\n          gridColors[t.r][t.c]=null;\n          cell.classList.remove('filled',...ALL_COLORS);\n          cell.classList.remove('exploding-cell');\n          createSparks(cell);\n          playExplosionSound();\n          addScore(50);\n        }\n        setTimeout(()=>b.remove(),180);\n      },2600);\n    },i*650);\n  });\n}\n'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix banana animation and filled-cell targeting'
          git push
