name: Apply explosion performance fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run explosion fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch explosion effect and sound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_sound = "function playExplosionSound(){if(!sfxEnabled||!audioCtx||isPaused)return;const now=audioCtx.currentTime;const d=.3,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(320,now);o.frequency.exponentialRampToValueAtTime(55,now+d);g.gain.setValueAtTime(.32,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+d);const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.type='sine';o2.frequency.setValueAtTime(720,now);o2.frequency.exponentialRampToValueAtTime(180,now+.22);g2.gain.setValueAtTime(.12,now);g2.gain.exponentialRampToValueAtTime(.001,now+.22);o2.connect(g2);g2.connect(audioCtx.destination);o2.start(now);o2.stop(now+.22)}"
          new_sound = "function playExplosionSound(){if(!sfxEnabled||!audioCtx||isPaused)return;const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(180,now);o.frequency.exponentialRampToValueAtTime(65,now+.16);g.gain.setValueAtTime(.12,now);g.gain.exponentialRampToValueAtTime(.001,now+.16);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.16);const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.type='triangle';o2.frequency.setValueAtTime(620,now);o2.frequency.exponentialRampToValueAtTime(120,now+.11);g2.gain.setValueAtTime(.09,now);g2.gain.exponentialRampToValueAtTime(.001,now+.11);o2.connect(g2);g2.connect(audioCtx.destination);o2.start(now);o2.stop(now+.11)}"

          old_sparks = "function createSparks(cell){const q=cell.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;const color=getComputedStyle(cell).backgroundColor;for(let i=0;i<8;i++){const spark=document.createElement('div');spark.className='spark';spark.style.backgroundColor=color;spark.style.color=color;const size=4+Math.random()*5;spark.style.width=size+'px';spark.style.height=size+'px';spark.style.left=x+'px';spark.style.top=y+'px';const a=Math.random()*Math.PI*2,d=50+Math.random()*115;spark.style.setProperty('--tx',(Math.cos(a)*d)+'px');spark.style.setProperty('--ty',(Math.sin(a)*d)+'px');document.body.appendChild(spark);setTimeout(()=>spark.remove(),1000)}}"
          new_sparks = "function createSparks(cell){const q=cell.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,color=getComputedStyle(cell).backgroundColor,frag=document.createDocumentFragment();for(let i=0;i<4;i++){const spark=document.createElement('div');spark.className='spark';spark.style.backgroundColor=color;spark.style.color=color;const size=4+Math.random()*4;spark.style.width=size+'px';spark.style.height=size+'px';spark.style.left=x+'px';spark.style.top=y+'px';const a=Math.random()*Math.PI*2,d=40+Math.random()*85;spark.style.setProperty('--tx',(Math.cos(a)*d)+'px');spark.style.setProperty('--ty',(Math.sin(a)*d)+'px');frag.appendChild(spark);setTimeout(()=>spark.remove(),700)}document.body.appendChild(frag)}"

          if old_sound not in s or old_sparks not in s:
              raise SystemExit('Expected source code was not found; no changes made.')
          s = s.replace(old_sound, new_sound, 1).replace(old_sparks, new_sparks, 1)
          s = s.replace("box-shadow:0 0 7px currentColor,0 0 14px currentColor,0 0 24px currentColor", "box-shadow:0 0 5px currentColor,0 0 10px currentColor;will-change:transform,opacity;contain:layout style paint", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/run-explosion-fix.yml
          git commit -m 'Fix explosion lag and update sound'
          git push
