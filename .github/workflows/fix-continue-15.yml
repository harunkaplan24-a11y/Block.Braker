name: Fix continue to 15 bananas
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continue behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "document.querySelectorAll('.action-buttons,.game-over-buttons,.continue-buttons').forEach(x=>{x.style.display='none';x.style.pointerEvents='none';});"
          new = old + "\n      startTimer();"
          if "startTimer();" not in s[s.find("if(!txt.includes('kaldığın yerden devam et'))"):s.find("if(!txt.includes('kaldığın yerden devam et'))") + 5000]:
              s = s.replace(old, new, 1)
          s = s.replace("for(let i=0;i<20;i++) setTimeout(()=>{monkey?.classList.remove('arms-throw'); void monkey?.offsetWidth; monkey?.classList.add('arms-throw'); throwBanana();},i*120);", "for(let i=0;i<15;i++) setTimeout(()=>{monkey?.classList.remove('arms-throw'); void monkey?.offsetWidth; monkey?.classList.add('arms-throw'); throwBanana();},i*120);")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-continue-15.yml
          git commit -m 'Fix continue to resume immediately with 15 bananas' || exit 0
          git rm .github/workflows/fix-continue-15.yml
          git commit -m 'Remove one-time continue fix workflow'
          git push