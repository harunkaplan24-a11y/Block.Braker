name: Balance medium pieces

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  balance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove five-block pieces and rebalance medium
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_pool = "const MEDIUM_GAME_POOL=[{shape:[[1,1,1,1]],color:'color-8'},{shape:[[1],[1],[1],[1]],color:'color-8'},{shape:[[1,1,1],[1,0,0]],color:'color-1'},{shape:[[1,1,1],[0,0,1]],color:'color-5'},{shape:[[1,1,1],[0,1,0]],color:'color-7'},{shape:[[1,1],[1,0],[1,0]],color:'color-2'},{shape:[[0,1,1],[1,1,0]],color:'color-4'},{shape:[[1,1,0],[0,1,1]],color:'color-6'},{shape:[[1,1,1,1,1]],color:'color-3'},{shape:[[1],[1],[1],[1],[1]],color:'color-3'},{shape:[[1,1],[0,1],[0,1]],color:'color-6'},{shape:[[1,0],[1,1],[0,1]],color:'color-7'},{shape:[[1,1,0],[1,1,1]],color:'color-2'},{shape:[[0,1,0],[1,1,1]],color:'color-8'}];"
          new_pool = "const MEDIUM_GAME_POOL=[{shape:[[1,1]],color:'color-3'},{shape:[[1],[1]],color:'color-3'},{shape:[[1,1,1]],color:'color-4'},{shape:[[1],[1],[1]],color:'color-4'},{shape:[[1,1],[1,1]],color:'color-5'},{shape:[[1,0],[1,1]],color:'color-6'},{shape:[[0,1],[1,1]],color:'color-7'},{shape:[[1,1,1,1]],color:'color-8'},{shape:[[1,1,1],[1,0,0]],color:'color-1'},{shape:[[1,1,1],[0,0,1]],color:'color-5'},{shape:[[1,1,1],[0,1,0]],color:'color-7'},{shape:[[1,1],[1,0],[1,0]],color:'color-2'},{shape:[[0,1,1],[1,1,0]],color:'color-4'},{shape:[[1,1,0],[0,1,1]],color:'color-6'}];"
          if old_pool not in s:
              raise SystemExit('Current medium pool not found')
          s = s.replace(old_pool, new_pool, 1)

          old_logic = "}else if(gameDifficulty==='medium'){const level=Math.min(currentLevel,6);let count=9+level*2;let base=MEDIUM_GAME_POOL.slice(0,Math.min(MEDIUM_GAME_POOL.length,count));if(level>=2)base=base.concat(LEVEL_SHAPES.slice(0,3));if(level>=3)base=base.concat(LEVEL_SHAPES.slice(2,5));if(level>=4)base=base.concat(MEDIUM_POOL.slice(4,8));if(level>=5)base=base.concat(LEVEL_SHAPES.slice(5));p=base}"
          new_logic = "}else if(gameDifficulty==='medium'){const level=Math.min(currentLevel,6);let count=8+level;let base=MEDIUM_GAME_POOL.slice(0,Math.min(MEDIUM_GAME_POOL.length,count));if(level>=2)base=base.concat(LEVEL_SHAPES.slice(0,1));if(level>=3)base=base.concat(LEVEL_SHAPES.slice(1,2));if(level>=4)base=base.concat(MEDIUM_POOL.slice(4,6));if(level>=5)base=base.concat(LEVEL_SHAPES.slice(2,3));p=base}"
          if old_logic not in s:
              raise SystemExit('Current medium difficulty logic not found')
          s = s.replace(old_logic, new_logic, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/balance-medium-pieces.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rebalance medium piece pool"
          git push
