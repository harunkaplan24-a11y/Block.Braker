name: Enable star burst effects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject star burst script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="star-burst.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('Could not find </head>')
              s = s.replace(marker, f'    {tag}\n{marker}', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/enable-star-bursts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add star burst celebrations on start and level up"
          git push
