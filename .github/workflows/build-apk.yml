name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools 33.0.2
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Prepare Cordova Project
        run: |
          cordova create cordova_app com.blockbreaker.game BlockBreaker
          rm -rf cordova_app/www/*
          cp index.html cordova_app/www/
          if [ -f config.xml ]; then cp config.xml cordova_app/; fi
          if [ -f icon.png ]; then cp icon.png cordova_app/www/; fi
          cd cordova_app
          cordova platform add android@12.0.0

      - name: Build APK via Gradle Wrapper
        run: |
          cd cordova_app/platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Block-Breaker-APK
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
