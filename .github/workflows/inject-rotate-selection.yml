name: Inject rotate selection
on:
  push:
    branches: [main]
    paths:
      - 'rotate-selection.js'
      - '.github/workflows/inject-rotate-selection.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject rotate script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="rotate-selection.js"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos == -1:
                  raise SystemExit('No closing body tag found')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable single-piece rotate selection'
          git push
