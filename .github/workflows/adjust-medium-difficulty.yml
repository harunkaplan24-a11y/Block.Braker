name: Adjust medium difficulty

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust-medium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make medium difficulty more challenging
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old = """            } else if (gameDifficulty === 'medium') {
                pool = EASY_POOL;
            } else {
"""
          new = """            } else if (gameDifficulty === 'medium') {
                // Medium: mostly easy pieces, with a few moderate shapes mixed in.
                pool = [
                    ...EASY_POOL,
                    MEDIUM_POOL[2],
                    MEDIUM_POOL[3],
                    MEDIUM_POOL[4],
                    MEDIUM_POOL[5]
                ];
            } else {
"""

          if old not in text:
              raise SystemExit("Target medium-difficulty code was not found; no changes made.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/adjust-medium-difficulty.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase medium difficulty balance"
          git push
