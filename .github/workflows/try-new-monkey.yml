name: Try new monkey asset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch game and remove one-time workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          asset = Path('assets/monkey-game.svg').read_text(encoding='utf-8')
          inner = re.sub(r'^\s*<svg[^>]*>', '', asset, count=1)
          inner = re.sub(r'</svg>\s*$', '', inner, count=1)

          pattern = r'<svg id="orangutan-svg" class="orangutan-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">.*?</svg>'
          replacement = '<svg id="orangutan-svg" class="orangutan-svg" viewBox="0 0 360 430" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>'
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find the old monkey SVG')

          s2 = s2.replace('.arm-left-group{transform-origin:30px 55px;', '.arm-left-group{transform-origin:105px 235px;')
          s2 = s2.replace('.arm-right-group{transform-origin:70px 55px;', '.arm-right-group{transform-origin:255px 235px;')
          s2 = s2.replace('const bananaCount=Math.min(cells.length,10);', 'const bananaCount=Math.min(cells.length,bananaCountOverride===null?10:bananaCountOverride);')
          s2 = s2.replace('function triggerBananaEffect(){', 'function triggerBananaEffect(bananaCountOverride=null){', 1)
          s2 = s2.replace("for(let i=0;i<20;i++)setTimeout(()=>triggerBananaEffect(),350+i*180);", "for(let i=0;i<20;i++)setTimeout(()=>triggerBananaEffect(1),350+i*180);")

          p.write_text(s2, encoding='utf-8')
          PY
          rm .github/workflows/try-new-monkey.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/try-new-monkey.yml
          git commit -m "Try new monkey with 20 banana continue effect"
          git push
