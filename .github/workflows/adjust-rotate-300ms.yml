name: Adjust rotate button
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 300ms rotate animation and keep button beside shape change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="action-buttons"><button id="rotate-btn" class="reroll-btn rotate-btn">↻ Yön Değiştir (250 🪙)</button><button id="reroll-btn" class="reroll-btn">🔄 Şekil Değiştir (500 🪙)</button></div>'
          new='<div class="action-buttons"><button id="rotate-btn" class="reroll-btn rotate-btn">↻ Yön Değiştir (250 🪙)</button><button id="reroll-btn" class="reroll-btn">🔄 Şekil Değiştir (500 🪙)</button></div>'
          if old not in s:
              raise SystemExit('rotate/shape button row not found')
          # Keep the two action buttons side-by-side and add a dedicated 300ms rotation animation.
          css_old='.action-buttons .reroll-btn{width:100%;max-width:320px;justify-content:center}'
          css_new='.action-buttons .reroll-btn{width:100%;max-width:320px;justify-content:center}.rotate-btn{background:#2563eb}.rotate-btn.selecting{background:#059669;box-shadow:0 0 0 2px rgba(52,211,153,.35)}.piece-holder.rotate-selectable{cursor:pointer;outline:2px solid #38bdf8;outline-offset:2px;animation:rotatePulse 1s ease-in-out infinite}.piece-holder.rotate-selectable::after{content:"↻";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(15,23,42,.48);color:#fff;font-size:30px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.8);pointer-events:none}@keyframes rotatePulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.12)}50%{box-shadow:0 0 0 4px rgba(56,189,248,.3)}}'
          if 'rotatePulse' not in s:
              if css_old not in s:
                  raise SystemExit('rotate CSS anchor not found')
              s=s.replace(css_old,css_new,1)
          # Animate the selected piece for exactly 300ms before committing the rotated shape.
          marker='function rotateShape(shape){'
          if marker not in s:
              raise SystemExit('rotateShape function not found')
          old_fn="function rotateShape(shape){const rows=shape.length,cols=shape[0].length,out=Array.from({length:cols},()=>Array(rows).fill(0));for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)out[c][rows-1-r]=shape[r][c];return out}"
          new_fn=old_fn+"function animateRotateSelection(holder,done){const grid=holder&&holder.querySelector('.piece-grid');if(!grid){done();return}grid.style.transition='transform 300ms ease';grid.style.transform='rotate(90deg)';setTimeout(()=>{grid.style.transform='';done()},300)}"
          if 'function animateRotateSelection(holder,done)' not in s:
              if old_fn not in s:
                  raise SystemExit('rotateShape implementation not found')
              s=s.replace(old_fn,new_fn,1)
          old_sel="coins-=250;p.shape=rotateShape(p.shape);setRotateSelectionMode(false);updateCoinsDisplay();saveGameState()"
          new_sel="coins-=250;const holder=document.querySelector('.piece-holder[data-type=\"main\"][data-index=\"'+index+'\"]');animateRotateSelection(holder,()=>{p.shape=rotateShape(p.shape);setRotateSelectionMode(false);updateCoinsDisplay();saveGameState()})"
          if old_sel in s:
              s=s.replace(old_sel,new_sel,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/adjust-rotate-300ms.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Set rotate animation to 300ms beside shape change'
          git push
