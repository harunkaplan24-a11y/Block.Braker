name: Fix continue resume
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continue behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="resumeGameBtn.addEventListener('click',()=>{if(coins<2000)return;gameOverModal.classList.remove('active');coins-=2000;updateCoinsDisplay();isPaused=false;startTimer();saveGameState();triggerArmAnim('arms-throw',700);for(let i=0;i<20;i++)setTimeout(()=>{triggerArmAnim('arms-throw',700);throwResumeBanana();},i*120);});"
          new="resumeGameBtn.addEventListener('click',()=>{if(coins<2000)return;gameOverModal.classList.remove('active');coins-=2000;updateCoinsDisplay();isPaused=false;generateNewPieces();startTimer();saveGameState();triggerArmAnim('arms-throw',700);for(let i=0;i<20;i++)setTimeout(()=>{triggerArmAnim('arms-throw',700);throwResumeBanana();},i*120);});"
          if old not in s:
              raise SystemExit('target handler not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix continue: resume with 20 bananas and keep blocks' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-continue-resume.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time continue workflow'
          git push
